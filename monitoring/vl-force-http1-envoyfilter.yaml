---
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: vl-force-http1
  namespace: monitoring
spec:
  workloadSelector:
    labels:
      istio.io/gateway-name: monitoring-vlogs
  configPatches:
    - applyTo: NETWORK_FILTER
      match:
        context: GATEWAY
        listener:
          portNumber: 443
          filterChain:
            sni: logs.raft.lutris.house
            filter:
              name: envoy.filters.network.http_connection_manager
      patch:
        operation: MERGE
        value:
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
            codec_type: HTTP1
