apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-istio-mesh-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
  annotations: {}
data:
  grafana-dashboard-istio-mesh-dashboard.json: |-
    {
      "apiVersion": "dashboard.grafana.app/v2",
      "kind": "Dashboard",
      "metadata": {
        "name": "1a9a8ea49444aae205c7737573e894f9",
        "namespace": "default"
      },
      "spec": {
        "annotations": [
          {
            "kind": "AnnotationQuery",
            "spec": {
              "query": {
                "kind": "DataQuery",
                "group": "grafana",
                "version": "v0",
                "datasource": {
                  "name": "-- Grafana --"
                },
                "spec": {}
              },
              "enable": true,
              "hide": true,
              "iconColor": "rgba(0, 211, 255, 1)",
              "name": "Annotations & Alerts",
              "builtIn": true,
              "legacyOptions": {
                "type": "dashboard"
              }
            }
          }
        ],
        "cursorSync": "Crosshair",
        "editable": true,
        "elements": {
          "panel-2": {
            "kind": "Panel",
            "spec": {
              "id": 2,
              "title": "Traffic Volume",
              "description": "Total requests in the cluster",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "$datasource"
                          },
                          "spec": {
                            "expr": "round(sum (rate(istio_requests_total{reporter=~\"source|waypoint\"}[$__rate_interval])), 0.01)"
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {
                    "interval": "5s"
                  }
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "stat",
                "version": "v11.0.0",
                "spec": {
                  "options": {
                    "legend": {
                      "calcs": [
                        "last",
                        "max"
                      ],
                      "displayMode": "table"
                    }
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "reqps",
                      "color": {
                        "mode": "fixed",
                        "fixedColor": "blue"
                      },
                      "custom": {
                        "fillOpacity": 10,
                        "gradientMode": "hue",
                        "showPoints": "never"
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
          "panel-3": {
            "kind": "Panel",
            "spec": {
              "id": 3,
              "title": "Success Rate",
              "description": "Total success rate of requests in the cluster",
              "links": [],
