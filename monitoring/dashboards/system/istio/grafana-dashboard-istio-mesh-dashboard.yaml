                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "$datasource"
                          },
                          "spec": {
                            "expr": "sum (rate(istio_requests_total{reporter=~\"source|waypoint\",response_code!~\"5..\"}[$__rate_interval])) / sum (rate(istio_requests_total{reporter=~\"source|waypoint\"}[$__rate_interval]))"
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {
                    "interval": "5s"
                  }
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "stat",
                "version": "v11.0.0",
                "spec": {
                  "options": {
                    "legend": {
                      "calcs": [
                        "last",
                        "max"
                      ],
                      "displayMode": "table"
                    }
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "percentunit",
                      "color": {
                        "mode": "fixed",
                        "fixedColor": "blue"
                      },
                      "custom": {
                        "fillOpacity": 10,
                        "gradientMode": "hue",
                        "showPoints": "never"
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
