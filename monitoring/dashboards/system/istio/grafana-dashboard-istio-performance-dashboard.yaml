          "panel-602": {
            "kind": "Panel",
            "spec": {
              "id": 602,
              "title": "vCPU",
              "description": "",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "expr": "sum(rate(container_cpu_usage_seconds_total{container=~\"discovery|istio-proxy\", pod=~\"istiod-.*\"}[$__rate_interval]))",
                            "format": "time_series",
                            "intervalFactor": 2,
                            "legendFormat": "Total (k8s)",
                            "step": 2
                          }
                        },
                        "refId": "A",
                        "hidden": false
