                              "tooltip": true,
                              "viz": false
                            }
                          }
                        ]
                      }
                    ]
                  }
                }
              }
            }
          },
          "panel-27": {
            "kind": "Panel",
            "spec": {
              "id": 27,
              "title": "Incoming Request Duration By Source",
              "description": "",
              "links": [],
              "data": {
                "kind": "QueryGroup",
