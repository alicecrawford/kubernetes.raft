apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-istio-service-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
  annotations: {}
data:
  grafana-dashboard-istio-service-dashboard.json: |-
    {
      "apiVersion": "dashboard.grafana.app/v2",
      "kind": "Dashboard",
      "metadata": {
        "name": "al56psw",
        "namespace": "default"
      },
      "spec": {
        "annotations": [
          {
            "kind": "AnnotationQuery",
            "spec": {
              "query": {
                "kind": "DataQuery",
                "group": "datasource",
                "version": "v0",
                "datasource": {
                  "name": "grafana"
                },
                "spec": {}
              },
              "enable": true,
              "hide": true,
              "iconColor": "rgba(0, 211, 255, 1)",
              "name": "Annotations & Alerts",
              "builtIn": true,
              "legacyOptions": {
                "type": "dashboard"
              }
            }
          }
        ],
        "cursorSync": "Off",
        "editable": true,
        "elements": {
          "panel-100": {
            "kind": "Panel",
            "spec": {
              "id": 100,
              "title": "TCP Sent Bytes",
              "description": "",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "expr": "sum(irate(istio_tcp_sent_bytes_total{reporter=~\"$qrep\", destination_service=\"$service\"}[$__rate_interval]))",
                            "format": "time_series",
                            "intervalFactor": 1,
                            "legendFormat": ""
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {
                    "maxDataPoints": 100
                  }
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "stat",
                "version": "10.1.5",
                "spec": {
                  "options": {
                    "colorMode": "none",
                    "graphMode": "area",
                    "justifyMode": "auto",
                    "orientation": "horizontal",
                    "reduceOptions": {
                      "calcs": [
                        "mean"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "textMode": "auto"
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "Bps",
                      "mappings": [
                        {
                          "type": "special",
                          "options": {
                            "match": "null",
                            "result": {
                              "text": "N/A"
                            }
                          }
                        }
                      ],
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "value": null,
                            "color": "green"
                          },
                          {
                            "value": 80,
                            "color": "red"
                          }
                        ]
                      },
                      "color": {
                        "mode": "fixed",
                        "fixedColor": "rgb(31, 120, 193)"
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
          "panel-12": {
            "kind": "Panel",
            "spec": {
              "id": 12,
              "title": "Client Request Volume",
              "description": "",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "expr": "round(sum(irate(istio_requests_total{reporter=~\"$qrep\",destination_service=\"$service\"}[$__rate_interval])), 0.001)",
                            "format": "time_series",
                            "intervalFactor": 1,
                            "step": 4
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {
                    "maxDataPoints": 100
                  }
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "stat",
                "version": "10.1.5",
                "spec": {
                  "options": {
                    "colorMode": "none",
                    "graphMode": "area",
                    "justifyMode": "auto",
                    "orientation": "horizontal",
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "textMode": "auto"
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "ops",
                      "mappings": [
                        {
                          "type": "special",
                          "options": {
                            "match": "null",
                            "result": {
                              "text": "N/A"
                            }
                          }
                        }
                      ],
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "value": null,
                            "color": "green"
                          },
                          {
                            "value": 80,
                            "color": "red"
                          }
                        ]
                      },
                      "color": {
                        "mode": "fixed",
                        "fixedColor": "rgb(31, 120, 193)"
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
          "panel-14": {
            "kind": "Panel",
            "spec": {
              "id": 14,
              "title": "Client Success Rate (non-5xx responses)",
              "description": "",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "editorMode": "code",
                            "expr": "sum(irate(istio_requests_total{reporter=~\"$qrep\",destination_service=\"$service\",response_code!~\"5.*\"}[$__rate_interval])) / (sum(irate(istio_requests_total{reporter=~\"$qrep\",destination_service=\"$service\"}[$__rate_interval])) or on () vector(1))",
                            "format": "time_series",
                            "intervalFactor": 1,
                            "range": true
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {
                    "maxDataPoints": 100
                  }
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "stat",
                "version": "10.1.5",
                "spec": {
                  "options": {
                    "colorMode": "none",
                    "graphMode": "area",
                    "justifyMode": "auto",
                    "orientation": "horizontal",
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "textMode": "auto"
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "percentunit",
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "value": null,
                            "color": "dark-red"
                          },
                          {
                            "value": 0.95,
                            "color": "dark-yellow"
                          },
                          {
                            "value": 0.99,
                            "color": "dark-green"
                          }
                        ]
                      },
                      "color": {
                        "mode": "fixed",
                        "fixedColor": "rgb(31, 120, 193)"
                      },
                      "noValue": "0"
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
          "panel-25": {
            "kind": "Panel",
            "spec": {
              "id": 25,
              "title": "Incoming Requests By Source And Response Code",
              "description": "",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "expr": "round(sum(irate(istio_requests_total{connection_security_policy=\"mutual_tls\",destination_service=\"$service\",reporter=~\"$qrep\",source_workload=~\"$srcwl\",source_workload_namespace=~\"$srcns\"}[$__rate_interval])) by (source_workload, source_workload_namespace, response_code), 0.001)",
                            "format": "time_series",
                            "intervalFactor": 1,
                            "legendFormat": "{{ source_workload }}.{{ source_workload_namespace }} : {{ response_code }} (\ud83d\udd10mTLS)",
                            "step": 2
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "expr": "round(sum(irate(istio_requests_total{connection_security_policy!=\"mutual_tls\", destination_service=\"$service\", reporter=~\"$qrep\", source_workload=~\"$srcwl\", source_workload_namespace=~\"$srcns\"}[$__rate_interval])) by (source_workload, source_workload_namespace, response_code), 0.001)",
                            "format": "time_series",
                            "intervalFactor": 1,
                            "legendFormat": "{{ source_workload }}.{{ source_workload_namespace }} : {{ response_code }}",
                            "step": 2
                          }
                        },
                        "refId": "B",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "10.1.5",
                "spec": {
                  "options": {
                    "legend": {
                      "calcs": [],
                      "displayMode": "list",
                      "placement": "bottom",
                      "showLegend": true
                    },
                    "tooltip": {
                      "mode": "single",
                      "sort": "none"
                    }
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "ops",
                      "min": 0,
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "value": null,
                            "color": "green"
                          },
                          {
                            "value": 80,
                            "color": "red"
                          }
                        ]
                      },
                      "color": {
                        "mode": "palette-classic"
                      },
                      "custom": {
                        "axisCenteredZero": false,
                        "axisColorMode": "text",
                        "axisLabel": "",
                        "axisPlacement": "auto",
                        "barAlignment": 0,
                        "drawStyle": "line",
                        "fillOpacity": 0,
                        "gradientMode": "none",
                        "hideFrom": {
                          "legend": false,
                          "tooltip": false,
                          "viz": false
                        },
                        "insertNulls": false,
                        "lineInterpolation": "linear",
                        "lineWidth": 1,
                        "pointSize": 5,
                        "scaleDistribution": {
                          "type": "linear"
                        },
                        "showPoints": "never",
                        "spanNulls": false,
                        "stacking": {
                          "group": "A",
                          "mode": "none"
                        },
                        "thresholdsStyle": {
                          "mode": "off"
                        }
                      }
                    },
                    "overrides": [
                      {
                        "matcher": {
                          "id": "byValue",
                          "options": {
                            "op": "gte",
                            "reducer": "allIsNull",
                            "value": 0
                          }
                        },
                        "properties": [
                          {
                            "id": "custom.hideFrom",
                            "value": {
                              "legend": true,
                              "tooltip": true,
                              "viz": false
                            }
                          }
                        ]
                      }
                    ]
                  }
                }
              }
            }
          },
          "panel-26": {
            "kind": "Panel",
            "spec": {
              "id": 26,
              "title": "Incoming Success Rate (non-5xx responses) By Source",
              "description": "",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
