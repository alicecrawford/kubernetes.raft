                            "expr": "sum(\n  argocd_app_info{\n    cluster=\"$cluster\",\nnamespace=~\"$namespace\",\njob=~\"$job\"\n\n,\ndest_server=~\"$kubernetes_cluster\",\nproject=~\"$project\"\n,\nexported_namespace=~\"$application_namespace\",\nname=~\"$application\"\n\n  }\n) by (namespace, job, dest_server, project, name, exported_namespace, health_status)\n",
                            "legendFormat": "{{ exported_namespace }}/{{ name }} - {{ health_status }}"
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "v11.4.0",
                "spec": {
                  "options": {
                    "legend": {
                      "calcs": [
                        "mean",
                        "max"
                      ],
                      "displayMode": "table",
                      "placement": "right",
                      "showLegend": true,
                      "sortBy": "Mean",
                      "sortDesc": true
                    },
                    "tooltip": {
                      "mode": "multi",
                      "sort": "desc"
                    }
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "short",
                      "decimals": 0,
                      "custom": {
                        "axisSoftMin": 0,
                        "fillOpacity": 100,
                        "lineWidth": 1,
                        "stacking": {
                          "mode": "normal"
                        }
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
