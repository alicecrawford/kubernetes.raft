apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-argocd-application-overview
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
  annotations: {}
data:
  grafana-dashboard-argocd-application-overview.json: |-
    {
      "apiVersion": "dashboard.grafana.app/v2",
      "kind": "Dashboard",
      "metadata": {
        "name": "argo-cd-application-overview-kask",
        "namespace": "default"
      },
      "spec": {
        "annotations": [
          {
            "kind": "AnnotationQuery",
            "spec": {
              "query": {
                "kind": "DataQuery",
                "group": "grafana",
                "version": "v0",
                "datasource": {
                  "name": "-- Grafana --"
                },
                "spec": {}
              },
              "enable": true,
              "hide": true,
              "iconColor": "rgba(0, 211, 255, 1)",
              "name": "Annotations & Alerts",
              "builtIn": true,
              "legacyOptions": {
                "type": "dashboard"
              }
            }
          }
        ],
        "cursorSync": "Off",
        "description": "A dashboard that monitors ArgoCD with a focus on the applications of ArgoCD. The dashboards were generated using [argo-cd-mixin](https://github.com/adinhodovic/argo-cd-mixin). Open issues and create feature requests in the repository.",
        "editable": false,
        "elements": {
          "panel-10": {
            "kind": "Panel",
            "spec": {
              "id": 10,
              "title": "Applications With Auto Sync Disabled",
              "description": "A table listing all applications with auto sync disabled managed by ArgoCD.",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "$datasource"
                          },
                          "spec": {
                            "expr": "sum(\n  argocd_app_info{\n    cluster=\"$cluster\",\nnamespace=~\"$namespace\",\njob=~\"$job\"\n\n,\ndest_server=~\"$kubernetes_cluster\",\nproject=~\"$project\"\n,\n    autosync_enabled!=\"true\"\n  }\n) by (job, dest_server, project, name, exported_namespace, autosync_enabled) > 0\n",
                            "format": "table",
                            "instant": true
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [
                    {
                      "kind": "Transformation",
                      "group": "organize",
                      "spec": {
                        "options": {
                          "excludeByName": {
                            "Time": true,
                            "Value": true,
                            "dest_server": true,
                            "job": true
                          },
                          "indexByName": {
                            "autosync_enabled": 3,
                            "exported_namespace": 1,
                            "name": 0,
                            "project": 2
                          },
                          "renameByName": {
                            "autosync_enabled": "Auto Sync Enabled",
                            "dest_server": "Kubernetes Cluster",
                            "exported_namespace": "Application Namespace",
                            "job": "Job",
                            "name": "Application",
                            "project": "Project"
                          }
                        }
                      }
                    }
                  ],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "table",
                "version": "v11.4.0",
                "spec": {
                  "options": {
                    "footer": {
                      "enablePagination": true
                    },
                    "sortBy": [
                      {
                        "desc": false,
                        "displayName": "Application"
                      }
                    ]
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "short",
                      "thresholds": {
                        "mode": "",
                        "steps": []
                      },
                      "links": [
                        {
                          "targetBlank": true,
                          "title": "Go To Application",
                          "url": "https://github.com/adinhodovic/argo-cd-mixin?tab=readme-ov-file#argocd-badges"
                        }
                      ]
                    },
                    "overrides": [
                      {
                        "matcher": {
                          "id": "byName",
                          "options": "autosync_enabled"
                        },
                        "properties": [
                          {
                            "id": "color",
                            "value": {
                              "fixedColor": "yellow",
                              "mode": "fixed"
                            }
                          },
                          {
                            "id": "custom.cellOptions",
                            "value": {
                              "type": "color-background"
                            }
                          }
                        ]
                      }
                    ]
                  }
                }
              }
            }
          },
          "panel-12": {
            "kind": "Panel",
            "spec": {
              "id": 12,
              "title": "Application Health Status by Application",
              "description": "A timeseries panel showing the health status of each application managed by ArgoCD.",
