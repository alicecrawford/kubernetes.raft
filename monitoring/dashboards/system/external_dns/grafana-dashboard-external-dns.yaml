                    "showThresholdLabels": false,
                    "showThresholdMarkers": true
                  },
                  "fieldConfig": {
                    "defaults": {
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "value": null,
                            "color": "light-red"
