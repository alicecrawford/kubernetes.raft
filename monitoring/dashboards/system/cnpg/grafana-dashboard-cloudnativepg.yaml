                    }
                  ],
                  "transformations": [
                    {
                      "kind": "Transformation",
                      "group": "organize",
                      "spec": {
                        "options": {
                          "excludeByName": {
                            "Time": true,
                            "__name__": true,
                            "container": true,
                            "endpoint": true,
                            "instance": true,
                            "job": true,
                            "name": false,
                            "namespace": true,
                            "pod": false
                          },
                          "indexByName": {
                            "Time": 0,
                            "Value": 9,
                            "__name__": 1,
                            "container": 2,
                            "endpoint": 3,
                            "instance": 4,
                            "job": 5,
                            "name": 7,
                            "namespace": 8,
                            "pod": 6
                          },
                          "renameByName": {
                            "__name__": "",
                            "name": "parameter"
                          }
                        }
                      }
                    },
                    {
                      "kind": "Transformation",
                      "group": "groupingToMatrix",
                      "spec": {
                        "options": {
                          "columnField": "pod",
                          "rowField": "parameter",
                          "valueField": "Value"
                        }
                      }
                    },
                    {
                      "kind": "Transformation",
                      "group": "organize",
                      "spec": {
                        "options": {
                          "excludeByName": {},
                          "indexByName": {},
                          "renameByName": {
                            "parameter\\pod": "parameter"
                          }
                        }
                      }
                    }
                  ],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "table",
                "version": "10.3.1",
                "spec": {
                  "options": {
                    "cellHeight": "sm",
                    "footer": {
                      "countRows": false,
                      "fields": "",
                      "reducer": [
                        "sum"
                      ],
                      "show": false
                    },
                    "showHeader": true,
                    "sortBy": []
                  },
                  "fieldConfig": {
                    "defaults": {
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "value": null,
                            "color": "dark-purple"
                          }
                        ]
                      },
                      "color": {
                        "mode": "thresholds"
                      },
                      "custom": {
                        "align": "auto",
                        "cellOptions": {
                          "type": "auto"
                        },
                        "filterable": true,
                        "inspect": false
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
