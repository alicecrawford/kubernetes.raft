apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-sealed-secrets-controller
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
  annotations: {}
data:
  grafana-dashboard-sealed-secrets-controller.json: |-
    {
      "apiVersion": "dashboard.grafana.app/v2",
      "kind": "Dashboard",
      "metadata": {
        "name": "UuEtZCVWz",
        "namespace": "default"
      },
      "spec": {
        "annotations": [
          {
            "kind": "AnnotationQuery",
            "spec": {
              "query": {
                "kind": "DataQuery",
                "group": "",
                "version": "v0",
                "spec": {}
              },
              "enable": true,
              "hide": true,
              "iconColor": "rgba(0, 211, 255, 1)",
              "name": "Annotations & Alerts",
              "builtIn": true,
              "legacyOptions": {
                "type": "dashboard"
              }
            }
          }
        ],
        "cursorSync": "Off",
        "description": "Sealed Secrets Controller",
        "editable": true,
        "elements": {
          "panel-2": {
            "kind": "Panel",
            "spec": {
              "id": 2,
              "title": "Unseal Request Rate/s",
              "description": "Rate of requests to unseal a SealedSecret.\n\nThis can include non-obvious operations such as deleting a SealedSecret.",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "",
                          "version": "v0",
                          "datasource": {
                            "name": "$datasource"
                          },
                          "spec": {
                            "expr": "sum(rate(sealed_secrets_controller_unseal_requests_total{}[1m]))",
                            "format": "time_series",
                            "instant": false,
                            "intervalFactor": 1,
                            "legendFormat": "rps"
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "",
                "spec": {
                  "options": {
                    "__angularMigration": {
                      "autoMigrateFrom": "graph",
                      "originalOptions": {
                        "aliasColors": {},
                        "bars": false,
                        "dashLength": 10,
                        "dashes": false,
                        "fill": 1,
                        "fillGradient": 0,
                        "hiddenSeries": false,
                        "legend": {
                          "avg": true,
                          "current": false,
                          "max": true,
                          "min": true,
                          "show": true,
                          "total": false,
                          "values": true
                        },
                        "lines": true,
                        "linewidth": 1,
                        "nullPointMode": "null",
                        "percentage": false,
                        "pointradius": 2,
                        "points": false,
                        "renderer": "flot",
                        "seriesOverrides": [],
                        "spaceLength": 10,
                        "stack": false,
                        "steppedLine": false,
                        "thresholds": [],
                        "timeRegions": [],
                        "tooltip": {
                          "shared": true,
                          "sort": 0,
                          "value_type": "individual"
                        },
                        "xaxis": {
                          "mode": "time",
                          "show": true,
                          "values": []
                        },
                        "yaxes": [
                          {
                            "format": "short",
                            "logBase": 1,
                            "show": true
                          },
                          {
                            "format": "short",
                            "logBase": 1,
                            "show": true
                          }
                        ],
                        "yaxis": {
                          "align": false
                        }
                      }
                    },
                    "dataLinks": []
                  },
                  "fieldConfig": {
                    "defaults": {},
                    "overrides": []
                  }
                }
              }
            }
          },
          "panel-3": {
            "kind": "Panel",
            "spec": {
              "id": 3,
              "title": "Unseal Error Rate/s",
              "description": "Rate of errors when unsealing a SealedSecret. \n\nReason for error included as label value, eg:\n- unseal = cryptography issue (key/namespace) or RBAC\n- unmanaged = destination Secret wasn't created by SealedSecrets\n- update = potentially RBAC\n- status = potentially RBAC\n- fetch = potentially RBAC\n",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "",
                          "version": "v0",
                          "datasource": {
                            "name": "$datasource"
                          },
                          "spec": {
                            "expr": "sum(rate(sealed_secrets_controller_unseal_errors_total{pod=~\"$pod\"}[1m])) by (reason)",
                            "format": "time_series",
                            "intervalFactor": 1,
                            "legendFormat": "{{ reason }}"
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "",
                "spec": {
                  "options": {
                    "__angularMigration": {
                      "autoMigrateFrom": "graph",
                      "originalOptions": {
                        "aliasColors": {},
                        "bars": false,
                        "dashLength": 10,
                        "dashes": false,
                        "fill": 1,
                        "fillGradient": 0,
                        "hiddenSeries": false,
                        "legend": {
                          "avg": false,
                          "current": false,
                          "hideEmpty": false,
                          "hideZero": false,
                          "max": false,
                          "min": false,
                          "show": true,
                          "total": false,
                          "values": false
                        },
                        "lines": true,
                        "linewidth": 1,
                        "nullPointMode": "null as zero",
                        "percentage": false,
                        "pointradius": 2,
                        "points": false,
                        "renderer": "flot",
                        "seriesOverrides": [],
                        "spaceLength": 10,
                        "stack": false,
                        "steppedLine": false,
                        "thresholds": [],
                        "timeRegions": [],
                        "tooltip": {
                          "shared": true,
                          "sort": 0,
                          "value_type": "individual"
                        },
                        "xaxis": {
                          "mode": "time",
                          "show": true,
                          "values": []
                        },
                        "yaxes": [
                          {
                            "format": "short",
                            "logBase": 1,
                            "show": true
                          },
                          {
                            "format": "short",
                            "logBase": 1,
                            "show": true
                          }
                        ],
                        "yaxis": {
                          "align": false
                        }
                      }
                    },
                    "dataLinks": []
                  },
                  "fieldConfig": {
                    "defaults": {},
                    "overrides": []
                  }
                }
              }
            }
          }
        },
        "layout": {
          "kind": "GridLayout",
          "spec": {
            "items": [
              {
                "kind": "GridLayoutItem",
                "spec": {
                  "x": 0,
                  "y": 0,
                  "width": 12,
                  "height": 9,
                  "element": {
                    "kind": "ElementReference",
                    "name": "panel-2"
                  }
                }
              },
              {
                "kind": "GridLayoutItem",
                "spec": {
                  "x": 12,
                  "y": 0,
                  "width": 12,
                  "height": 9,
                  "element": {
                    "kind": "ElementReference",
                    "name": "panel-3"
                  }
                }
              }
            ]
          }
        },
        "links": [
          {
            "title": "GitHub",
            "type": "link",
            "icon": "external link",
            "tooltip": "View Project on GitHub",
            "url": "https://github.com/bitnami/sealed-secrets",
            "tags": [],
            "asDropdown": false,
            "targetBlank": false,
            "includeVars": false,
            "keepTime": false
          }
        ],
        "liveNow": false,
        "preload": false,
        "tags": [],
        "timeSettings": {
          "from": "now-1h",
          "to": "now",
          "autoRefresh": "",
          "autoRefreshIntervals": [
            "5s",
            "10s",
            "30s",
            "1m",
            "5m",
            "15m",
            "30m",
            "1h",
            "2h",
            "1d"
          ],
          "hideTimepicker": false,
          "fiscalYearStartMonth": 0
        },
        "title": "Sealed Secrets Controller",
        "variables": [
          {
            "kind": "DatasourceVariable",
            "spec": {
              "name": "datasource",
              "pluginId": "prometheus",
              "refresh": "onDashboardLoad",
              "regex": "",
              "current": {
                "text": "prometheus",
                "value": "prometheus"
              },
              "options": [],
              "multi": false,
              "includeAll": false,
              "hide": "dontHide",
              "skipUrlSync": false,
              "allowCustomValue": true
            }
          },
          {
            "kind": "QueryVariable",
            "spec": {
              "name": "pod",
              "current": {
                "text": "All",
                "value": "$__all"
              },
              "hide": "dontHide",
              "refresh": "onDashboardLoad",
              "skipUrlSync": false,
              "query": {
                "kind": "DataQuery",
                "group": "",
                "version": "v0",
                "datasource": {
                  "name": "$datasource"
                },
                "spec": {
                  "__legacyStringValue": "label_values(kube_pod_info, pod)"
                }
              },
              "regex": "/^sealed-secrets-controller.*$/",
              "sort": "disabled",
              "definition": "label_values(kube_pod_info, pod)",
              "options": [],
              "multi": false,
              "includeAll": true,
              "allowCustomValue": true
            }
          }
        ]
      }
    }
