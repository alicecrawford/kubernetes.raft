apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-victorialogs-single-node
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
  annotations: {}
data:
  grafana-dashboard-victorialogs-single-node.json: |-
    {
      "apiVersion": "dashboard.grafana.app/v2",
      "kind": "Dashboard",
      "metadata": {
        "name": "OqPIZTX4z",
        "namespace": "default"
      },
      "spec": {
        "annotations": [
          {
            "kind": "AnnotationQuery",
            "spec": {
              "query": {
                "kind": "DataQuery",
                "group": "grafana",
                "version": "v0",
                "datasource": {
                  "name": "-- Grafana --"
                },
                "spec": {
                  "limit": 100,
                  "matchAny": false,
                  "tags": [],
                  "type": "dashboard"
                }
              },
              "enable": true,
              "hide": true,
              "iconColor": "rgba(0, 211, 255, 1)",
              "name": "Annotations & Alerts",
              "builtIn": true,
              "legacyOptions": {
                "type": "dashboard"
              }
            }
          },
          {
            "kind": "AnnotationQuery",
            "spec": {
              "query": {
                "kind": "DataQuery",
                "group": "prometheus",
                "version": "v0",
                "datasource": {
                  "name": "VictoriaMetrics"
                },
                "spec": {
                  "expr": "sum(vm_app_version{job=~\"$job\", instance=~\"$instance\"}) by(short_version) unless (sum(vm_app_version{job=~\"$job\", instance=~\"$instance\"} offset $__interval) by(short_version))",
                  "interval": "",
                  "refId": "Anno"
                }
              },
              "enable": true,
              "hide": true,
              "iconColor": "blue",
              "name": "version change",
              "legacyOptions": {
                "textFormat": "{{short_version}}",
                "titleFormat": "Version change"
              }
            }
          },
          {
            "kind": "AnnotationQuery",
            "spec": {
              "query": {
                "kind": "DataQuery",
                "group": "prometheus",
                "version": "v0",
                "datasource": {
                  "name": "VictoriaMetrics"
                },
                "spec": {
                  "expr": "sum(changes(vm_app_start_timestamp{job=~\"$job\", instance=~\"$instance\"}[$__interval])) by(instance)",
                  "interval": "",
                  "refId": "Anno"
                }
              },
              "enable": true,
              "hide": true,
              "iconColor": "orange",
              "name": "restarts",
              "legacyOptions": {
                "textFormat": "{{instance}} restarted"
              }
            }
          },
          {
            "kind": "AnnotationQuery",
            "spec": {
              "query": {
                "kind": "DataQuery",
                "group": "prometheus",
                "version": "v0",
                "datasource": {
                  "name": "VictoriaMetrics"
                },
                "spec": {
                  "expr": "go_memstats_last_gc_time_seconds{job=~\"$job\", instance=~\"$instance\"} * 1000",
                  "interval": "",
                  "refId": "Anno"
                }
              },
              "enable": false,
              "hide": false,
              "iconColor": "#57f26d1c",
              "name": "gc",
              "filter": {
                "ids": [
                  75
                ]
              },
              "legacyOptions": {
                "textFormat": "GC event",
                "useValueForTime": true
              }
            }
          }
        ],
        "cursorSync": "Off",
        "description": "Overview for single-node VictoriaLogs v1.29.0 or higher",
        "editable": false,
        "elements": {
          "panel-102": {
            "kind": "Panel",
            "spec": {
              "id": 102,
              "title": "Query rate",
              "description": "Rate of incoming query requests by endpoint path. This metric tracks the query load on VictoriaLogs, including different query interfaces and internal operations. \n\nHigher rates indicate increased query activity from users or applications. Monitor for sudden spikes that might indicate new dashboards, automated queries, or potential performance issues. Sustained high rates may require scaling query processing capacity.",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "VictoriaMetrics"
                          },
                          "spec": {
                            "editorMode": "code",
                            "expr": "sum(rate(vl_http_requests_total{job=~\"$job\",instance=~\"$instance\",path=~\"^/(internal/)?select.*\",polycule=~\"$cluster\"}[$__rate_interval])) by(path,polycule)",
                            "format": "time_series",
                            "interval": "",
                            "intervalFactor": 1,
                            "legendFormat": "{{path}}",
                            "range": true
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "12.3.0",
                "spec": {
                  "options": {
                    "legend": {
                      "calcs": [
                        "mean",
                        "lastNotNull",
                        "max"
                      ],
                      "displayMode": "table",
                      "placement": "bottom",
                      "showLegend": true,
                      "sortBy": "Max",
                      "sortDesc": true
                    },
                    "tooltip": {
                      "hideZeros": false,
                      "mode": "multi",
                      "sort": "desc"
                    }
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "short",
                      "min": 0,
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "value": 0,
                            "color": "green"
                          },
                          {
                            "value": 80,
                            "color": "red"
                          }
                        ]
                      },
                      "color": {
                        "mode": "palette-classic"
                      },
                      "noValue": "0",
                      "custom": {
                        "axisBorderShow": false,
                        "axisCenteredZero": false,
                        "axisColorMode": "text",
                        "axisLabel": "",
                        "axisPlacement": "auto",
                        "barAlignment": 0,
                        "barWidthFactor": 0.6,
                        "drawStyle": "line",
                        "fillOpacity": 0,
                        "gradientMode": "none",
                        "hideFrom": {
                          "legend": false,
                          "tooltip": false,
                          "viz": false
                        },
                        "insertNulls": false,
                        "lineInterpolation": "linear",
                        "lineWidth": 1,
                        "pointSize": 5,
                        "scaleDistribution": {
                          "type": "linear"
                        },
                        "showPoints": "never",
                        "showValues": false,
                        "spanNulls": false,
                        "stacking": {
                          "group": "A",
                          "mode": "none"
                        },
                        "thresholdsStyle": {
                          "mode": "off"
                        }
                      }
                    },
                    "overrides": [
                      {
                        "matcher": {
                          "id": "byValue",
                          "options": {
                            "op": "gte",
                            "reducer": "allIsZero",
                            "value": 0
                          }
                        },
                        "properties": [
                          {
                            "id": "custom.hideFrom",
                            "value": {
                              "legend": true,
                              "tooltip": true,
                              "viz": true
                            }
                          }
                        ]
                      }
                    ]
                  }
                }
              }
            }
          },
          "panel-103": {
            "kind": "Panel",
            "spec": {
              "id": 103,
              "title": "Insert duration p99",
              "description": "99th percentile of insert operation duration. This represents the time it takes for 99% of insert operations to complete. High values indicate slow ingestion performance that could affect overall system throughput. Spikes may suggest storage bottlenecks, resource contention, or inefficient data processing.",
