                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "VictoriaMetrics"
                          },
                          "spec": {
                            "editorMode": "code",
                            "expr": "sum(histogram_quantile(0.99, sum(rate(go_sched_latencies_seconds_bucket{job=~\"$job\",instance=~\"$instance\",polycule=~\"$cluster\"}[$__rate_interval])) by(instance,le,polycule))) by(instance,polycule)",
