          "panel-97": {
            "kind": "Panel",
            "spec": {
              "id": 97,
              "title": "Message processors ($instance)",
              "description": "Number of active message processors handling log ingestion. These processors parse and process incoming log messages before storage.\n\nThe `soft limit` line is the configured concurrency limit for insert request processing (`-maxConcurrentInserts`). It is marked as soft because streaming/slow clients may keep many HTTP requests in-flight while only a limited number of them are actively processed at the same time.\n\nIf processors are consistently high, correlate with ingestion rate and memory/CPU usage. Sudden growth may indicate burst traffic, slow clients/network, or backpressure from storage nodes.",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "VictoriaMetrics"
                          },
                          "spec": {
                            "editorMode": "code",
                            "expr": "max(max_over_time(vl_insert_processors_count{job=~\"$job\",instance=~\"$instance\",polycule=~\"$cluster\"}[$__rate_interval])) by(instance,polycule)",
                            "format": "time_series",
                            "interval": "",
                            "intervalFactor": 1,
                            "legendFormat": "{{instance}}",
                            "range": true
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "VictoriaMetrics"
                          },
                          "spec": {
                            "editorMode": "code",
                            "expr": "max(max_over_time(vm_concurrent_insert_capacity{job=~\"$job\",instance=~\"$instance\",polycule=~\"$cluster\"}[$__rate_interval])) by(polycule)",
                            "instant": false,
                            "legendFormat": "soft limit",
                            "range": true
                          }
                        },
                        "refId": "B",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "12.3.0",
                "spec": {
                  "options": {
                    "legend": {
                      "calcs": [
