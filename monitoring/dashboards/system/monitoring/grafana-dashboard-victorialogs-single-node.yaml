              "description": "Number of storage blocks scanned per query (99th percentile). Each block contains logs for a single log stream over some time range.\n\nHigh values usually mean the query has to consider many blocks, for example because:\n- The time range is wide\n- The query doesn\u2019t narrow down log streams (e.g. no good stream filter)\n- The filters are not selective and cannot quickly skip blocks\n\nCorrelate with `Bytes/query p99`: if blocks are high but bytes are low, each block contributes little data (often OK). If both are high, the query is reading a lot of data from storage.",
