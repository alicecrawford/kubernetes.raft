apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-victoriametrics-operator
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
  annotations: {}
data:
  grafana-dashboard-victoriametrics-operator.json: |-
    {
      "apiVersion": "dashboard.grafana.app/v2",
      "kind": "Dashboard",
      "metadata": {
        "name": "1H179hunk",
        "namespace": "default"
      },
      "spec": {
        "annotations": [
          {
            "kind": "AnnotationQuery",
            "spec": {
              "query": {
                "kind": "DataQuery",
                "group": "datasource",
                "version": "v0",
                "datasource": {
                  "name": "grafana"
                },
                "spec": {
                  "limit": 100,
                  "matchAny": false,
                  "tags": [],
                  "type": "dashboard"
                }
              },
              "enable": true,
              "hide": true,
              "iconColor": "rgba(0, 211, 255, 1)",
              "name": "Annotations & Alerts",
              "builtIn": true,
              "legacyOptions": {
                "type": "dashboard"
              }
            }
          },
          {
            "kind": "AnnotationQuery",
            "spec": {
              "query": {
                "kind": "DataQuery",
                "group": "prometheus",
                "version": "v0",
                "datasource": {
                  "name": "$ds"
                },
                "spec": {}
              },
              "enable": true,
              "hide": false,
              "iconColor": "dark-yellow",
              "name": "restarts",
              "legacyOptions": {
                "expr": "sum(changes(vm_app_start_timestamp{job=~\"$job\",instance=~\"$instance\",polycule=~\"$cluster\"}[$__interval])) by(job,polycule)",
                "textFormat": "{{job}} restarted"
              }
            }
          }
        ],
        "cursorSync": "Off",
        "description": "Overview for operator VictoriaMetrics v0.25.0 or higher",
        "editable": false,
        "elements": {
          "panel-10": {
            "kind": "Panel",
            "spec": {
              "id": 10,
              "title": "Reconcile errors by controller",
              "description": "Non zero metrics indicates about error with CR object definition (typos or incorrect values) or errors with kubernetes API connection.",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "$ds"
                          },
                          "spec": {
                            "editorMode": "code",
                            "exemplar": false,
                            "expr": "sum(rate(controller_runtime_reconcile_errors_total{job=~\"$job\",instance=~\"$instance\",polycule=~\"$cluster\"}[$__rate_interval])) by(controller,polycule) > 0",
                            "instant": false,
                            "legendFormat": "{{controller}}",
                            "range": true
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "$ds"
                          },
                          "spec": {
                            "editorMode": "code",
                            "expr": "sum(rate(controller_runtime_reconcile_total{job=~\"$job\",instance=~\"$instance\",result=\"error\",polycule=~\"$cluster\"}[$__rate_interval])) by(controller,polycule) > 0",
                            "legendFormat": "result errors: {{controller}}",
                            "range": true
                          }
                        },
                        "refId": "B",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "12.3.0",
                "spec": {
                  "options": {
                    "legend": {
                      "calcs": [
                        "lastNotNull",
                        "max"
                      ],
                      "displayMode": "table",
                      "placement": "bottom",
                      "showLegend": true
                    },
                    "tooltip": {
                      "hideZeros": false,
                      "mode": "multi",
                      "sort": "none"
                    }
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "short",
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "value": 0,
                            "color": "green"
                          },
                          {
                            "value": 80,
                            "color": "red"
                          }
                        ]
                      },
                      "color": {
                        "mode": "palette-classic"
                      },
                      "custom": {
                        "axisBorderShow": false,
                        "axisCenteredZero": false,
                        "axisColorMode": "text",
                        "axisLabel": "",
                        "axisPlacement": "auto",
                        "barAlignment": 0,
                        "barWidthFactor": 0.6,
                        "drawStyle": "line",
                        "fillOpacity": 10,
                        "gradientMode": "none",
                        "hideFrom": {
                          "legend": false,
                          "tooltip": false,
                          "viz": false
                        },
                        "insertNulls": false,
                        "lineInterpolation": "linear",
                        "lineWidth": 1,
                        "pointSize": 5,
                        "scaleDistribution": {
                          "type": "linear"
                        },
                        "showPoints": "never",
                        "showValues": false,
                        "spanNulls": false,
                        "stacking": {
                          "group": "A",
                          "mode": "none"
                        },
                        "thresholdsStyle": {
                          "mode": "off"
                        }
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
