apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-victorialogs-vlagent
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
  annotations: {}
data:
  grafana-dashboard-victorialogs-vlagent.json: |-
    {
      "apiVersion": "dashboard.grafana.app/v2",
      "kind": "Dashboard",
      "metadata": {
        "name": "Y5Z9GzMGz",
        "namespace": "default"
      },
      "spec": {
        "annotations": [
          {
            "kind": "AnnotationQuery",
            "spec": {
              "query": {
                "kind": "DataQuery",
                "group": "datasource",
                "version": "v0",
                "datasource": {
                  "name": "grafana"
                },
                "spec": {
                  "limit": 100,
                  "matchAny": false,
                  "tags": [],
                  "type": "dashboard"
                }
              },
              "enable": true,
              "hide": true,
              "iconColor": "rgba(0, 211, 255, 1)",
              "name": "Annotations & Alerts",
              "builtIn": true,
              "legacyOptions": {
                "type": "dashboard"
              }
            }
          },
          {
            "kind": "AnnotationQuery",
            "spec": {
              "query": {
                "kind": "DataQuery",
                "group": "prometheus",
                "version": "v0",
                "datasource": {
                  "name": "VictoriaMetrics"
                },
                "spec": {}
              },
              "enable": true,
              "hide": true,
              "iconColor": "dark-blue",
              "name": "version",
              "legacyOptions": {
                "expr": "sum(vm_app_version{job=~\"$job\",instance=~\"$instance\",polycule=~\"$cluster\"}) by(short_version,polycule) unless sum(vm_app_version{job=~\"$job\",instance=~\"$instance\",polycule=~\"$cluster\"} offset $__interval) by(short_version,polycule)",
                "textFormat": "{{short_version}}",
                "titleFormat": "Version change"
              }
            }
          },
          {
            "kind": "AnnotationQuery",
            "spec": {
              "query": {
                "kind": "DataQuery",
                "group": "prometheus",
                "version": "v0",
                "datasource": {
                  "name": "VictoriaMetrics"
                },
                "spec": {}
              },
              "enable": true,
              "hide": false,
              "iconColor": "dark-yellow",
              "name": "restarts",
              "legacyOptions": {
                "expr": "sum(changes(vm_app_start_timestamp{job=~\"$job\",instance=~\"$instance\",polycule=~\"$cluster\"}[$__interval])) by(job,instance,polycule)",
                "textFormat": "{{job}}:{{instance}} restarted"
              }
            }
          }
        ],
        "cursorSync": "Crosshair",
        "description": "Overview for VictoriaMetrics vlagent v1.29.0 or higher",
        "editable": false,
        "elements": {
          "panel-102": {
            "kind": "Panel",
            "spec": {
              "id": 102,
              "title": "Ingested bytes",
              "description": "Shows the cumulative number of log entries ingested. \n\nThe size is calculated before compression.",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "VictoriaMetrics"
                          },
                          "spec": {
                            "editorMode": "code",
                            "expr": "sum(rate(vl_bytes_ingested_total{job=~\"$job\",instance=~\"$instance\",polycule=~\"$cluster\"}[$__rate_interval])) by(polycule)",
                            "interval": "",
                            "legendFormat": "__auto",
                            "range": true
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "stat",
                "version": "12.3.0",
                "spec": {
                  "options": {
                    "colorMode": "value",
                    "graphMode": "area",
                    "justifyMode": "auto",
                    "orientation": "auto",
                    "percentChangeColorMode": "standard",
                    "reduceOptions": {
                      "calcs": [
                        "last"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "showPercentChange": false,
                    "text": {},
                    "textMode": "auto",
                    "wideLayout": true
                  },
                  "fieldConfig": {
                    "defaults": {
                      "min": 0,
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "value": 0,
                            "color": "green"
                          }
                        ]
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
          "panel-107": {
            "kind": "Panel",
            "spec": {
              "id": 107,
              "title": "Logging rate",
              "description": "Shows the rate of logging the messages by their level. Unexpected spike in rate is a good reason to check logs.",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "VictoriaMetrics"
                          },
                          "spec": {
                            "editorMode": "code",
                            "exemplar": true,
                            "expr": "sum(rate(vm_log_messages_total{job=~\"$job\",instance=~\"$instance\",level!=\"info\",polycule=~\"$cluster\"}[$__rate_interval])) by(job,level,polycule) > 0",
                            "format": "time_series",
                            "interval": "5m",
                            "intervalFactor": 1,
                            "legendFormat": "{{job}} - {{level}}",
                            "range": true
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "12.3.0",
                "spec": {
                  "options": {
                    "legend": {
                      "calcs": [
                        "mean",
                        "lastNotNull",
                        "max"
                      ],
                      "displayMode": "table",
                      "placement": "bottom",
                      "showLegend": true,
                      "sortBy": "Last *",
                      "sortDesc": true
                    },
                    "tooltip": {
                      "hideZeros": false,
                      "mode": "multi",
                      "sort": "desc"
                    }
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "short",
                      "min": 0,
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "value": 0,
                            "color": "green"
                          },
                          {
                            "value": 80,
                            "color": "red"
                          }
                        ]
                      },
                      "color": {
                        "mode": "palette-classic"
                      },
                      "custom": {
                        "axisBorderShow": false,
                        "axisCenteredZero": false,
                        "axisColorMode": "text",
                        "axisLabel": "",
                        "axisPlacement": "auto",
                        "barAlignment": 0,
                        "barWidthFactor": 0.6,
                        "drawStyle": "bars",
                        "fillOpacity": 100,
                        "gradientMode": "none",
                        "hideFrom": {
                          "legend": false,
                          "tooltip": false,
                          "viz": false
                        },
                        "insertNulls": false,
                        "lineInterpolation": "linear",
                        "lineWidth": 1,
                        "pointSize": 5,
                        "scaleDistribution": {
                          "type": "linear"
                        },
                        "showPoints": "never",
                        "showValues": false,
                        "spanNulls": false,
                        "stacking": {
                          "group": "A",
                          "mode": "normal"
                        },
                        "thresholdsStyle": {
                          "mode": "off"
                        }
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
          "panel-111": {
            "kind": "Panel",
            "spec": {
              "id": 111,
              "title": "RSS memory % usage ",
              "description": "Percentage of used RSS memory (resident).\nThe RSS memory shows the amount of memory recently accessed by the application. It includes anonymous memory and data from recently accessed files (aka page cache).\nThe application's performance will significantly degrade when memory usage is close to 100%.\n\nClick on the line and choose Drilldown to show memory usage per instance",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "VictoriaMetrics"
                          },
                          "spec": {
                            "editorMode": "code",
                            "exemplar": true,
                            "expr": "max(max_over_time(process_resident_memory_bytes{job=~\"$job\",instance=~\"$instance\",polycule=~\"$cluster\"}[$__rate_interval]) / vm_available_memory_bytes{job=~\"$job\",instance=~\"$instance\",polycule=~\"$cluster\"}) by(job,polycule)",
                            "interval": "",
                            "legendFormat": "__auto",
                            "range": true
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "11.5.0",
                "spec": {
                  "options": {
                    "legend": {
                      "calcs": [
                        "mean",
                        "lastNotNull",
                        "max"
                      ],
                      "displayMode": "table",
                      "placement": "bottom",
                      "showLegend": true,
                      "sortBy": "Last *",
                      "sortDesc": true
                    },
                    "tooltip": {
                      "hideZeros": false,
                      "mode": "multi",
                      "sort": "desc"
