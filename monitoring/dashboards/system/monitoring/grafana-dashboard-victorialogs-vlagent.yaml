                      "displayMode": "table",
                      "placement": "bottom",
                      "showLegend": true,
                      "sortBy": "Last *",
                      "sortDesc": true
                    },
                    "tooltip": {
                      "hideZeros": false,
                      "mode": "multi",
                      "sort": "desc"
                    }
                  },
                  "fieldConfig": {
                    "defaults": {
