                      "min": 0,
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "value": null,
                            "color": "green"
                          },
                          {
                            "value": 80,
                            "color": "red"
                          }
                        ]
                      },
                      "color": {
                        "mode": "palette-classic"
                      },
                      "links": [
                        {
                          "targetBlank": true,
                          "title": "Drilldown",
                          "url": "/d/G7Z9GzMGz?viewPanel=117&var-job=${__field.labels.job}&var-ds=$ds&var-instance=$instance&${__url_time_range}"
                        }
                      ],
                      "custom": {
                        "axisCenteredZero": false,
                        "axisColorMode": "text",
                        "axisLabel": "",
                        "axisPlacement": "auto",
                        "barAlignment": 0,
                        "drawStyle": "line",
                        "fillOpacity": 0,
                        "gradientMode": "none",
                        "hideFrom": {
                          "legend": false,
                          "tooltip": false,
                          "viz": false
                        },
                        "lineInterpolation": "linear",
                        "lineWidth": 1,
                        "pointSize": 5,
                        "scaleDistribution": {
                          "type": "linear"
                        },
                        "showPoints": "never",
                        "spanNulls": false,
                        "stacking": {
                          "group": "A",
                          "mode": "none"
                        },
                        "thresholdsStyle": {
                          "mode": "off"
                        }
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
          "panel-115": {
            "kind": "Panel",
            "spec": {
              "id": 115,
              "title": "",
              "description": "",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "text",
                "version": "9.2.3",
                "spec": {
                  "options": {
                    "code": {
                      "language": "plaintext",
                      "showLineNumbers": false,
                      "showMiniMap": false
                    },
                    "content": "Drilldown row is used by other panels on the dashboard to show more detailed metrics per-instance.",
                    "mode": "markdown"
                  },
                  "fieldConfig": {
                    "defaults": {},
                    "overrides": []
                  }
                }
              },
              "transparent": true
            }
          },
          "panel-117": {
            "kind": "Panel",
            "spec": {
              "id": 117,
              "title": "RSS memory usage ($instance)",
              "description": "Shows the used memory (resident).\nThe application's performance will significantly degrade when memory usage is close to 100%.",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
