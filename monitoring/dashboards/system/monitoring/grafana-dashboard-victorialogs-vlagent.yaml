                        },
                        "showPoints": "never",
                        "spanNulls": false,
                        "stacking": {
                          "group": "A",
                          "mode": "none"
                        },
                        "thresholdsStyle": {
                          "mode": "off"
                        }
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
          "panel-119": {
            "kind": "Panel",
            "spec": {
              "id": 119,
              "title": "CPU usage ($instance)",
              "description": "",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "VictoriaMetrics"
                          },
                          "spec": {
                            "editorMode": "code",
                            "exemplar": false,
                            "expr": "sum(rate(process_cpu_seconds_total{job=~\"$job\",instance=~\"$instance\",polycule=~\"$cluster\"}[$__rate_interval])) by(job,instance,polycule)",
                            "format": "time_series",
                            "interval": "",
                            "intervalFactor": 1,
                            "legendFormat": "{{instance}} ({{job}})",
                            "range": true
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "11.5.0",
                "spec": {
                  "options": {
                    "legend": {
                      "calcs": [
                        "mean",
