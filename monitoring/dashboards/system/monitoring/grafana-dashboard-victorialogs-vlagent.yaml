                          "version": "v0",
                          "datasource": {
                            "name": "VictoriaMetrics"
                          },
                          "spec": {
                            "editorMode": "code",
                            "exemplar": true,
                            "expr": "max_over_time(process_resident_memory_bytes{job=~\"$job\",instance=~\"$instance\",polycule=~\"$cluster\"}[$__rate_interval])",
                            "interval": "",
                            "legendFormat": "{{instance}} ({{job}})",
                            "range": true
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "11.5.0",
                "spec": {
                  "options": {
