          "panel-125": {
            "kind": "Panel",
            "spec": {
              "id": 125,
              "title": "Persistent queue size  to ($url)",
              "description": "Shows the persistent queue size of pending samples in bytes which hasn't been flushed to remote storage yet. \n\nIncreasing of value might be a sign of connectivity issues. In such cases, vlagent starts to flush pending data on disk with attempt to send it later once connection is restored.\n\nRemote write URLs are hidden by default but might be unveiled once `-remoteWrite.showURL` is set to true.",
              "links": [
                {
                  "title": "Troubleshooting",
                  "url": "https://docs.victoriametrics.com/victorialogs/vlagent/#troubleshooting"
                }
              ],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "VictoriaMetrics"
                          },
                          "spec": {
                            "editorMode": "code",
                            "exemplar": true,
                            "expr": "sum(vlagent_remotewrite_pending_data_bytes{job=~\"$job\",instance=~\"$instance\",url=~\"$url\",polycule=~\"$cluster\"}) by(instance,url,polycule)",
                            "interval": "",
                            "legendFormat": "{{instance}} => {{url}}",
                            "range": true
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "11.5.0",
                "spec": {
                  "options": {
                    "legend": {
                      "calcs": [
                        "mean",
                        "lastNotNull",
                        "max"
                      ],
                      "displayMode": "table",
                      "placement": "bottom",
                      "showLegend": true
                    },
