          "panel-98": {
            "kind": "Panel",
            "spec": {
              "id": 98,
              "title": "Persistent queue write saturation",
              "description": "Shows write saturation of the persistent queue. If the threshold of 0.9sec is reached, then the persistent queue is saturated by more than 90% and vlagent won't be able to keep up with flushing data on disk. In this case, consider to decrease load on the vlagent or improve the disk throughput.",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "VictoriaMetrics"
                          },
                          "spec": {
                            "editorMode": "code",
                            "exemplar": true,
                            "expr": "max(rate(vm_persistentqueue_write_duration_seconds_total{job=~\"$job\",instance=~\"$instance\",polycule=~\"$cluster\"}[$__rate_interval])) by(job,polycule)",
                            "interval": "",
                            "legendFormat": "__auto",
                            "range": true
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
