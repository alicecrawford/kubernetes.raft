apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-alertmanager-overview
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
  annotations: {}
data:
  grafana-dashboard-alertmanager-overview.json: |-
    {
      "apiVersion": "dashboard.grafana.app/v2",
      "kind": "Dashboard",
      "metadata": {
        "name": "alertmanager-overview",
        "namespace": "default"
      },
      "spec": {
        "annotations": [
          {
            "kind": "AnnotationQuery",
            "spec": {
              "query": {
                "kind": "DataQuery",
                "group": "grafana",
                "version": "v0",
                "datasource": {
                  "name": "-- Grafana --"
                },
                "spec": {}
              },
              "enable": true,
              "hide": true,
              "iconColor": "rgba(0, 211, 255, 1)",
              "name": "Annotations & Alerts",
              "builtIn": true,
              "legacyOptions": {
                "type": "dashboard"
              }
            }
          }
        ],
        "cursorSync": "Crosshair",
        "editable": false,
        "elements": {
          "panel-2": {
            "kind": "Panel",
            "spec": {
              "id": 2,
              "title": "Alerts",
              "description": "current set of alerts stored in the Alertmanager",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "$datasource"
                          },
                          "spec": {
                            "expr": "sum(alertmanager_alerts{namespace=~\"$namespace\",service=~\"$service\",polycule=~\"$cluster\"}) by(namespace,service,instance,polycule)",
                            "intervalFactor": 2,
                            "legendFormat": "{{instance}}"
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "v13.0.0",
                "spec": {
                  "options": {
                    "legend": {
                      "showLegend": false
                    },
                    "tooltip": {
                      "mode": "multi"
                    }
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "none",
                      "custom": {
                        "fillOpacity": 10,
                        "showPoints": "never",
                        "stacking": {
                          "mode": "normal"
                        }
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
          "panel-3": {
            "kind": "Panel",
            "spec": {
              "id": 3,
              "title": "Alerts receive rate",
              "description": "rate of successful and invalid alerts received by the Alertmanager",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "$datasource"
                          },
                          "spec": {
                            "expr": "sum(rate(alertmanager_alerts_received_total{namespace=~\"$namespace\",service=~\"$service\",polycule=~\"$cluster\"}[$__rate_interval])) by(namespace,service,instance,polycule)",
                            "intervalFactor": 2,
                            "legendFormat": "{{instance}} Received"
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "$datasource"
                          },
                          "spec": {
                            "expr": "sum(rate(alertmanager_alerts_invalid_total{namespace=~\"$namespace\",service=~\"$service\",polycule=~\"$cluster\"}[$__rate_interval])) by(namespace,service,instance,polycule)",
                            "intervalFactor": 2,
                            "legendFormat": "{{instance}} Invalid"
                          }
                        },
                        "refId": "B",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "v13.0.0",
                "spec": {
                  "options": {
                    "legend": {
                      "showLegend": false
                    },
                    "tooltip": {
                      "mode": "multi"
                    }
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "ops",
                      "custom": {
                        "fillOpacity": 10,
                        "showPoints": "never",
                        "stacking": {
                          "mode": "normal"
                        }
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
          "panel-5": {
            "kind": "Panel",
            "spec": {
              "id": 5,
              "title": "$integration: Notifications Send Rate",
              "description": "rate of successful and invalid notifications sent by the Alertmanager",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "$datasource"
                          },
                          "spec": {
                            "expr": "sum(rate(alertmanager_notifications_total{namespace=~\"$namespace\",service=~\"$service\",integration=\"$integration\",polycule=~\"$cluster\"}[$__rate_interval])) by(integration,namespace,service,instance,polycule)",
                            "intervalFactor": 2,
                            "legendFormat": "{{instance}} Total"
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "$datasource"
                          },
                          "spec": {
                            "expr": "sum(rate(alertmanager_notifications_failed_total{namespace=~\"$namespace\",service=~\"$service\",integration=\"$integration\",polycule=~\"$cluster\"}[$__rate_interval])) by(integration,namespace,service,instance,polycule)",
                            "intervalFactor": 2,
                            "legendFormat": "{{instance}} Failed"
                          }
                        },
                        "refId": "B",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "v13.0.0",
                "spec": {
                  "options": {
                    "legend": {
                      "showLegend": false
                    },
                    "tooltip": {
                      "mode": "multi"
                    }
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "ops",
                      "custom": {
                        "fillOpacity": 10,
                        "showPoints": "never",
                        "stacking": {
                          "mode": "normal"
                        }
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
          "panel-6": {
            "kind": "Panel",
            "spec": {
              "id": 6,
              "title": "$integration: Notification Duration",
              "description": "latency of notifications sent by the Alertmanager",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "$datasource"
                          },
                          "spec": {
                            "expr": "histogram_quantile(0.99, sum(rate(alertmanager_notification_latency_seconds_bucket{namespace=~\"$namespace\",service=~\"$service\",integration=\"$integration\",polycule=~\"$cluster\"}[$__rate_interval])) by(le,namespace,service,instance,polycule))",
                            "intervalFactor": 2,
                            "legendFormat": "{{instance}} 99th Percentile"
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "$datasource"
                          },
                          "spec": {
                            "expr": "histogram_quantile(0.50, sum(rate(alertmanager_notification_latency_seconds_bucket{namespace=~\"$namespace\",service=~\"$service\",integration=\"$integration\",polycule=~\"$cluster\"}[$__rate_interval])) by(le,namespace,service,instance,polycule))",
                            "intervalFactor": 2,
                            "legendFormat": "{{instance}} Median"
                          }
                        },
                        "refId": "B",
                        "hidden": false
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "$datasource"
                          },
                          "spec": {
                            "expr": "sum(rate(alertmanager_notification_latency_seconds_sum{namespace=~\"$namespace\",service=~\"$service\",integration=\"$integration\",polycule=~\"$cluster\"}[$__rate_interval])) by(namespace,service,instance,polycule) / sum(rate(alertmanager_notification_latency_seconds_count{namespace=~\"$namespace\",service=~\"$service\",integration=\"$integration\",polycule=~\"$cluster\"}[$__rate_interval])) by(namespace,service,instance,polycule)",
                            "intervalFactor": 2,
                            "legendFormat": "{{instance}} Average"
                          }
                        },
                        "refId": "C",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "v13.0.0",
                "spec": {
                  "options": {
                    "legend": {
                      "showLegend": false
                    },
                    "tooltip": {
                      "mode": "multi"
                    }
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "s",
                      "custom": {
                        "fillOpacity": 10,
                        "showPoints": "never",
                        "stacking": {
                          "mode": "normal"
                        }
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          }
        },
        "layout": {
          "kind": "RowsLayout",
          "spec": {
            "rows": [
              {
                "kind": "RowsLayoutRow",
                "spec": {
                  "title": "Alerts",
                  "collapse": false,
                  "layout": {
                    "kind": "GridLayout",
                    "spec": {
                      "items": [
                        {
                          "kind": "GridLayoutItem",
                          "spec": {
                            "x": 0,
                            "y": 0,
                            "width": 12,
                            "height": 7,
                            "element": {
                              "kind": "ElementReference",
                              "name": "panel-2"
                            }
                          }
                        },
                        {
                          "kind": "GridLayoutItem",
                          "spec": {
                            "x": 12,
                            "y": 0,
                            "width": 12,
                            "height": 7,
                            "element": {
                              "kind": "ElementReference",
                              "name": "panel-3"
                            }
                          }
                        }
                      ]
                    }
                  }
                }
              },
              {
                "kind": "RowsLayoutRow",
                "spec": {
                  "title": "Notifications",
                  "collapse": false,
                  "layout": {
                    "kind": "GridLayout",
                    "spec": {
                      "items": [
                        {
                          "kind": "GridLayoutItem",
                          "spec": {
                            "x": 0,
                            "y": 0,
                            "width": 12,
                            "height": 7,
                            "element": {
                              "kind": "ElementReference",
                              "name": "panel-5"
                            },
                            "repeat": {
                              "mode": "variable",
                              "value": "integration"
                            }
                          }
                        },
                        {
                          "kind": "GridLayoutItem",
                          "spec": {
                            "x": 12,
                            "y": 0,
                            "width": 12,
                            "height": 7,
                            "element": {
                              "kind": "ElementReference",
                              "name": "panel-6"
                            },
                            "repeat": {
                              "mode": "variable",
                              "value": "integration"
                            }
                          }
                        }
                      ]
                    }
                  }
                }
              }
            ]
          }
        },
        "links": [],
        "liveNow": false,
        "preload": false,
        "tags": [
          "alertmanager-mixin",
          "vm-k8s-stack"
        ],
        "timeSettings": {
          "timezone": "browser",
          "from": "now-1h",
          "to": "now",
          "autoRefresh": "",
          "autoRefreshIntervals": [
            "30s"
          ],
          "hideTimepicker": false,
          "fiscalYearStartMonth": 0
        },
        "title": "Alertmanager / Overview",
        "variables": [
          {
            "kind": "DatasourceVariable",
            "spec": {
              "name": "datasource",
              "pluginId": "prometheus",
              "refresh": "never",
              "regex": "",
              "current": {
                "text": "Prometheus",
                "value": "Prometheus"
              },
              "options": [],
              "multi": false,
              "includeAll": false,
              "label": "Data Source",
              "hide": "dontHide",
              "skipUrlSync": false,
              "allowCustomValue": true
            }
          },
          {
            "kind": "QueryVariable",
            "spec": {
              "name": "namespace",
              "current": {
                "text": "",
                "value": ""
              },
              "label": "namespace",
              "hide": "dontHide",
              "refresh": "onTimeRangeChanged",
              "skipUrlSync": false,
              "query": {
                "kind": "DataQuery",
                "group": "prometheus",
                "version": "v0",
                "datasource": {
                  "name": "${datasource}"
                },
                "spec": {
                  "__legacyStringValue": "label_values(alertmanager_alerts, namespace)"
                }
              },
              "regex": "",
              "sort": "alphabeticalAsc",
              "options": [],
              "multi": false,
              "includeAll": false,
              "allowCustomValue": true
            }
          },
          {
            "kind": "QueryVariable",
            "spec": {
              "name": "service",
              "current": {
                "text": "",
                "value": ""
              },
              "label": "service",
              "hide": "dontHide",
              "refresh": "onTimeRangeChanged",
              "skipUrlSync": false,
              "query": {
                "kind": "DataQuery",
                "group": "prometheus",
                "version": "v0",
                "datasource": {
                  "name": "${datasource}"
                },
                "spec": {
                  "__legacyStringValue": "label_values(alertmanager_alerts, service)"
                }
              },
              "regex": "",
              "sort": "alphabeticalAsc",
              "options": [],
              "multi": false,
              "includeAll": false,
              "allowCustomValue": true
            }
          },
          {
            "kind": "QueryVariable",
            "spec": {
              "name": "integration",
              "current": {
                "text": "$__all",
                "value": "$__all"
              },
              "hide": "hideVariable",
              "refresh": "onTimeRangeChanged",
              "skipUrlSync": false,
              "query": {
                "kind": "DataQuery",
                "group": "prometheus",
                "version": "v0",
                "datasource": {
                  "name": "${datasource}"
                },
                "spec": {
                  "__legacyStringValue": "label_values(alertmanager_notifications_total{integration=~\".*\",polycule=~\"$cluster\"}, integration)"
                }
              },
              "regex": "",
              "sort": "alphabeticalAsc",
              "options": [],
              "multi": false,
              "includeAll": true,
              "allowCustomValue": true
            }
          },
          {
            "kind": "ConstantVariable",
            "spec": {
              "name": "cluster",
              "query": ".*",
              "current": {
                "text": ".*",
                "value": ".*"
              },
              "label": "cluster",
              "hide": "hideVariable",
              "skipUrlSync": false
            }
          }
        ]
      }
    }
