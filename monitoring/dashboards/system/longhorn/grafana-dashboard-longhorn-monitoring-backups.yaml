                        "properties": [
                          {
                            "id": "custom.cellOptions",
                            "value": {
                              "type": "color-background"
                            }
                          },
                          {
                            "id": "custom.width",
                            "value": 120
                          }
                        ]
                      },
                      {
                        "matcher": {
                          "id": "byName",
                          "options": "Recurring Job"
                        },
                        "properties": [
                          {
                            "id": "custom.width",
                            "value": 160
                          }
                        ]
                      }
                    ]
                  }
                }
              }
            }
