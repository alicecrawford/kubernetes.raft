                "kind": "DataQuery",
                "group": "prometheus",
                "version": "v0",
                "datasource": {
                  "name": "${datasource}"
                },
                "spec": {
                  "query": "label_values(longhorn_volume_state{pvc_namespace=~\"$namespace\"}, pvc)",
                  "refId": "StandardVariableQuery"
                }
              },
              "regex": "",
              "sort": "alphabeticalAsc",
              "definition": "label_values(longhorn_volume_state{pvc_namespace=~\"$namespace\"}, pvc)",
