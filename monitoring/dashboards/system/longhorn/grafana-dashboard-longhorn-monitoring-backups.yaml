apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-longhorn-monitoring-backups
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
  annotations: {}
data:
  grafana-dashboard-longhorn-monitoring-backups.json: |-
    {
      "apiVersion": "dashboard.grafana.app/v2",
      "kind": "Dashboard",
      "metadata": {
        "name": "ozk-lh-mon",
        "namespace": "default"
      },
      "spec": {
        "annotations": [
          {
            "kind": "AnnotationQuery",
            "spec": {
              "query": {
                "kind": "DataQuery",
                "group": "grafana",
                "version": "v0",
                "datasource": {
                  "name": "grafana"
                },
                "spec": {
                  "limit": 100,
                  "matchAny": false,
                  "tags": [],
                  "type": "dashboard"
                }
              },
              "enable": true,
              "hide": true,
              "iconColor": "rgba(0, 211, 255, 1)",
              "name": "Annotations & Alerts",
              "builtIn": true,
              "legacyOptions": {
                "type": "dashboard"
              }
            }
          }
        ],
        "cursorSync": "Off",
        "description": "An example dashboard for Longhorn. Updated by ONZACK AG (Robin Hermann)",
        "editable": true,
        "elements": {
          "panel-10": {
            "kind": "Panel",
            "spec": {
              "id": 10,
              "title": "Volume Capacity",
              "description": "The capacity of each Longhorn volume",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "editorMode": "code",
                            "expr": "avg by (pvc_namespace, pvc, volume) (longhorn_volume_capacity_bytes{pvc_namespace=~\"$namespace\",pvc=~\"$pvc\",volume=~\"$pv_name\"})",
                            "format": "table",
                            "instant": true,
                            "interval": "",
                            "intervalFactor": 1,
                            "legendFormat": "{{volume}}"
                          }
                        },
                        "refId": "capacity",
                        "hidden": false
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "editorMode": "code",
                            "exemplar": false,
                            "expr": "label_replace(label_replace(avg by(volume, namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes),\"pvc\",\"$1\",\"persistentvolumeclaim\",\"(.*)\"),\"pvc_namespace\",\"$1\",\"namespace\",\"(.*)\")",
                            "format": "table",
                            "instant": true,
                            "legendFormat": "{{volume}}",
                            "range": false
                          }
                        },
                        "refId": "used",
                        "hidden": false
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "editorMode": "code",
                            "exemplar": false,
                            "expr": "100 *\r\n  label_replace(\r\n    avg by (volume, namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes), \"pvc\", \"$1\", \"persistentvolumeclaim\", \"(.*)\"\r\n  )\r\n/ on (namespace, pvc)\r\n  label_replace(\r\n    avg by (pvc_namespace, pvc) (\r\n      longhorn_volume_capacity_bytes{pvc_namespace=~\"$namespace\",pvc=~\"$pvc\",volume=~\"$pv_name\"} and on (volume) (longhorn_volume_state != 3)\r\n    ),\r\n    \"namespace\", \"$1\", \"pvc_namespace\", \"(.*)\"\r\n  )",
                            "format": "table",
                            "instant": true,
                            "legendFormat": "{{volume}}",
                            "range": false
                          }
                        },
                        "refId": "usage-percentage",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [
                    {
                      "kind": "Transformation",
                      "group": "merge",
                      "spec": {
                        "options": {}
                      }
                    },
                    {
                      "kind": "Transformation",
                      "group": "organize",
                      "spec": {
                        "options": {
                          "excludeByName": {
                            "Time": true,
                            "namespace": true,
                            "persistentvolumeclaim": true
                          },
                          "includeByName": {},
                          "indexByName": {
                            "Time": 0,
                            "Value #capacity": 5,
                            "Value #usage-percentage": 6,
                            "Value #used": 4,
                            "namespace": 7,
                            "persistentvolumeclaim": 8,
                            "pvc": 2,
                            "pvc_namespace": 3,
                            "volume": 1
                          },
                          "renameByName": {
                            "Value": "Capacity",
                            "Value #A": "Usage",
                            "Value #B": "Used",
                            "Value #capacity": "Capacity",
                            "Value #usage-percentage": "Usage",
                            "Value #used": "Used",
                            "name": "Persistent Volume Claim",
                            "pvc": "PVC",
                            "pvc_namespace": "Namespace",
                            "volume": "Volume"
                          }
                        }
                      }
                    },
                    {
                      "kind": "Transformation",
                      "group": "filterByValue",
                      "spec": {
                        "options": {
                          "filters": [
                            {
                              "config": {
                                "id": "isNull",
                                "options": {}
                              },
                              "fieldName": "Volume"
                            }
                          ],
                          "match": "any",
                          "type": "exclude"
                        }
                      }
                    }
                  ],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "table",
                "version": "13.0.1",
                "spec": {
                  "options": {
                    "cellHeight": "sm",
                    "frameIndex": 4,
                    "showHeader": true,
                    "sortBy": [
                      {
                        "desc": true,
                        "displayName": "Usage"
                      }
                    ]
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "bytes",
                      "decimals": 1,
                      "min": 0,
                      "mappings": [
                        {
                          "type": "value",
                          "options": {
                            "": {
                              "text": ""
                            }
                          }
                        }
                      ],
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "value": 0,
                            "color": "green"
                          },
                          {
                            "value": 75,
                            "color": "#EAB839"
                          },
                          {
                            "value": 90,
                            "color": "red"
                          }
                        ]
                      },
                      "custom": {
                        "align": "auto",
                        "cellOptions": {
                          "type": "auto"
                        },
                        "footer": {
                          "reducers": []
                        },
                        "inspect": false
                      }
                    },
                    "overrides": [
                      {
                        "matcher": {
                          "id": "byName",
                          "options": "Usage"
                        },
                        "properties": [
                          {
                            "id": "custom.cellOptions",
                            "value": {
                              "mode": "basic",
                              "type": "gauge",
                              "valueDisplayMode": "color"
                            }
                          }
                        ]
                      },
                      {
                        "matcher": {
                          "id": "byName",
                          "options": "Usage"
                        },
                        "properties": [
                          {
                            "id": "unit",
                            "value": "percent"
                          },
                          {
                            "id": "min",
                            "value": 0
                          },
                          {
                            "id": "max",
                            "value": 100
                          }
                        ]
                      },
                      {
                        "matcher": {
                          "id": "byName",
                          "options": "Volume"
                        },
                        "properties": [
                          {
                            "id": "custom.width",
                            "value": 344
                          }
                        ]
                      }
                    ]
                  }
                }
              }
            }
          },
          "panel-101": {
            "kind": "Panel",
            "spec": {
              "id": 101,
              "title": "Volumes (backup-expected)",
              "description": "Longhorn volumes bound to a PVC in the selected Namespace/PVC scope. These are the volumes we expect to be backed up. NOTE: Longhorn does not export backup POLICY as a metric - this dashboard measures observed backup COVERAGE (via longhorn_volume_last_backup_at).",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "editorMode": "code",
                            "expr": "count(longhorn_volume_last_backup_at{pvc!=\"\",pvc_namespace=~\"$namespace\",pvc=~\"$pvc\",volume=~\"$pv_name\"}) OR on() vector(0)",
                            "range": true
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "stat",
                "version": "13.0.1",
                "spec": {
                  "options": {
                    "colorMode": "background",
                    "graphMode": "none",
                    "justifyMode": "auto",
                    "orientation": "auto",
                    "percentChangeColorMode": "standard",
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "showPercentChange": false,
                    "textMode": "auto",
                    "wideLayout": true
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "short",
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "value": 0,
                            "color": "blue"
                          }
                        ]
                      },
                      "color": {
                        "mode": "thresholds"
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
          "panel-102": {
            "kind": "Panel",
            "spec": {
              "id": 102,
              "title": "With Recent Backup",
              "description": "Volumes with a successful backup within the 'Stale after' window.",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "editorMode": "code",
                            "expr": "count(\n  ((time() - longhorn_volume_last_backup_at{pvc!=\"\",pvc_namespace=~\"$namespace\",pvc=~\"$pvc\",volume=~\"$pv_name\"}) <= $stale_after)\n  and (longhorn_volume_last_backup_at{pvc!=\"\",pvc_namespace=~\"$namespace\",pvc=~\"$pvc\",volume=~\"$pv_name\"} > 0)\n) OR on() vector(0)",
                            "range": true
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "stat",
                "version": "13.0.1",
                "spec": {
                  "options": {
                    "colorMode": "background",
                    "graphMode": "none",
                    "justifyMode": "auto",
                    "orientation": "auto",
                    "percentChangeColorMode": "standard",
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "showPercentChange": false,
                    "textMode": "auto",
                    "wideLayout": true
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "short",
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "value": 0,
                            "color": "green"
                          }
                        ]
                      },
                      "color": {
                        "mode": "thresholds"
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
          "panel-103": {
            "kind": "Panel",
            "spec": {
              "id": 103,
              "title": "Stale Backup",
              "description": "Volumes that DO have backups, but the newest one is older than the 'Stale after' window - backups are falling behind schedule.",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "editorMode": "code",
                            "expr": "count(\n  ((time() - longhorn_volume_last_backup_at{pvc!=\"\",pvc_namespace=~\"$namespace\",pvc=~\"$pvc\",volume=~\"$pv_name\"}) > $stale_after)\n  and (longhorn_volume_last_backup_at{pvc!=\"\",pvc_namespace=~\"$namespace\",pvc=~\"$pvc\",volume=~\"$pv_name\"} > 0)\n) OR on() vector(0)",
                            "range": true
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "stat",
                "version": "13.0.1",
                "spec": {
                  "options": {
                    "colorMode": "background",
                    "graphMode": "none",
                    "justifyMode": "auto",
                    "orientation": "auto",
                    "percentChangeColorMode": "standard",
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "showPercentChange": false,
                    "textMode": "auto",
                    "wideLayout": true
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "short",
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "value": 0,
                            "color": "green"
                          },
                          {
                            "value": 1,
                            "color": "yellow"
                          }
                        ]
                      },
                      "color": {
                        "mode": "thresholds"
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
          "panel-104": {
            "kind": "Panel",
            "spec": {
              "id": 104,
              "title": "Without Any Backup",
              "description": "Backup-expected volumes that have NEVER been backed up (longhorn_volume_last_backup_at == 0). Either not covered by a backup policy, or the first run hasn't happened yet. Deselect known-OK namespaces/PVCs above to keep this at 0.",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "editorMode": "code",
                            "expr": "count(longhorn_volume_last_backup_at{pvc!=\"\",pvc_namespace=~\"$namespace\",pvc=~\"$pvc\",volume=~\"$pv_name\"} == 0) OR on() vector(0)",
                            "range": true
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "stat",
                "version": "13.0.1",
                "spec": {
                  "options": {
                    "colorMode": "background",
                    "graphMode": "none",
                    "justifyMode": "auto",
                    "orientation": "auto",
                    "percentChangeColorMode": "standard",
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "showPercentChange": false,
                    "textMode": "auto",
                    "wideLayout": true
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "short",
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "value": 0,
                            "color": "green"
                          },
                          {
                            "value": 1,
                            "color": "red"
                          }
                        ]
                      },
                      "color": {
                        "mode": "thresholds"
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
          "panel-105": {
            "kind": "Panel",
            "spec": {
              "id": 105,
              "title": "Failed Backup Jobs",
              "description": "Longhorn Backup CRs currently in the Error state (longhorn_backup_state == 4), for the selected Backup Job(s) and Namespace/PVC scope.",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "editorMode": "code",
                            "expr": "count(\n  (longhorn_backup_state{recurring_job=~\"$recurring_job\"} == 4)\n  and on(volume) longhorn_volume_last_backup_at{pvc!=\"\",pvc_namespace=~\"$namespace\",pvc=~\"$pvc\",volume=~\"$pv_name\"}\n) OR on() vector(0)",
                            "range": true
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "stat",
                "version": "13.0.1",
                "spec": {
                  "options": {
                    "colorMode": "background",
                    "graphMode": "none",
                    "justifyMode": "auto",
                    "orientation": "auto",
                    "percentChangeColorMode": "standard",
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "showPercentChange": false,
                    "textMode": "auto",
                    "wideLayout": true
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "short",
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "value": 0,
                            "color": "green"
                          },
                          {
                            "value": 1,
                            "color": "red"
                          }
                        ]
                      },
                      "color": {
                        "mode": "thresholds"
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
          "panel-106": {
            "kind": "Panel",
            "spec": {
              "id": 106,
              "title": "Oldest Backup Age",
              "description": "Age of the oldest successful backup among backup-expected volumes.",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "editorMode": "code",
                            "expr": "max(\n  (time() - longhorn_volume_last_backup_at{pvc!=\"\",pvc_namespace=~\"$namespace\",pvc=~\"$pvc\",volume=~\"$pv_name\"})\n  and (longhorn_volume_last_backup_at{pvc!=\"\",pvc_namespace=~\"$namespace\",pvc=~\"$pvc\",volume=~\"$pv_name\"} > 0)\n) OR on() vector(0)",
                            "range": true
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "stat",
                "version": "13.0.1",
                "spec": {
                  "options": {
                    "colorMode": "background",
                    "graphMode": "none",
                    "justifyMode": "auto",
                    "orientation": "auto",
                    "percentChangeColorMode": "standard",
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "showPercentChange": false,
                    "textMode": "auto",
                    "wideLayout": true
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "s",
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "value": 0,
                            "color": "green"
                          },
                          {
                            "value": 86400,
                            "color": "yellow"
                          },
                          {
                            "value": 93600,
                            "color": "red"
                          }
                        ]
                      },
                      "color": {
                        "mode": "thresholds"
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
          "panel-110": {
            "kind": "Panel",
            "spec": {
              "id": 110,
              "title": "PVC Backup Coverage",
              "description": "Every backup-expected Longhorn PVC and the age of its last successful backup. 'Never' (red) = no backup has ever completed for this volume. Sorted worst-first.",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "editorMode": "code",
                            "expr": "max by (pvc_namespace, pvc, volume) (\n  time() - longhorn_volume_last_backup_at{pvc!=\"\",pvc_namespace=~\"$namespace\",pvc=~\"$pvc\",volume=~\"$pv_name\"}\n)",
                            "format": "table",
                            "instant": true
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "editorMode": "code",
                            "expr": "sum by (pvc_namespace, pvc, volume) (\n  (longhorn_backup_actual_size_bytes\n  * on(volume) group_left(pvc, pvc_namespace) (max by(volume, pvc, pvc_namespace)(longhorn_volume_capacity_bytes) > bool 0))\n  and on(volume) longhorn_volume_last_backup_at{pvc!=\"\",pvc_namespace=~\"$namespace\",pvc=~\"$pvc\",volume=~\"$pv_name\"}\n)",
                            "format": "table",
                            "instant": true
                          }
                        },
                        "refId": "B",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [
                    {
                      "kind": "Transformation",
                      "group": "merge",
                      "spec": {
                        "options": {}
                      }
                    },
                    {
                      "kind": "Transformation",
                      "group": "organize",
                      "spec": {
                        "options": {
                          "excludeByName": {
                            "Time": true,
                            "__name__": true,
                            "container": true,
                            "endpoint": true,
                            "instance": true,
                            "job": true,
                            "namespace": true,
                            "node": true,
                            "pod": true,
