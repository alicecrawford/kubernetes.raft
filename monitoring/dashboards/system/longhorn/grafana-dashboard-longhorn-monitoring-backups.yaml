          "panel-111": {
            "kind": "Panel",
            "spec": {
              "id": 111,
              "title": "Backup Jobs Overview",
              "description": "Per recurring backup job (backup 'group'): number of Backup CRs tracked, how many are in Error state, and total storage consumed. Filtered by the Backup Job variable. Counts ALL Backup CRs including orphaned ones (volumes already deleted) - so 'Failed' here can exceed the 'Failed Backup Jobs' stat, which only counts failures for volumes that still exist. '(manual / no recurring job)' = backups not created by a recurring job.",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "expr": "label_replace(count by (recurring_job) (longhorn_backup_state{recurring_job=~\"$recurring_job\"}), \"recurring_job\", \"(manual / no recurring job)\", \"recurring_job\", \"^$\")",
                            "format": "table",
                            "instant": true
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "expr": "label_replace(\n  (count by (recurring_job) (longhorn_backup_state{recurring_job=~\"$recurring_job\"} == 4))\n  or\n  (0 * count by (recurring_job) (longhorn_backup_state{recurring_job=~\"$recurring_job\"}))\n, \"recurring_job\", \"(manual / no recurring job)\", \"recurring_job\", \"^$\")",
                            "format": "table",
                            "instant": true
                          }
                        },
                        "refId": "B",
                        "hidden": false
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "expr": "label_replace(sum by (recurring_job) (longhorn_backup_actual_size_bytes{recurring_job=~\"$recurring_job\"}), \"recurring_job\", \"(manual / no recurring job)\", \"recurring_job\", \"^$\")",
                            "format": "table",
                            "instant": true
                          }
                        },
                        "refId": "C",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [
                    {
                      "kind": "Transformation",
                      "group": "merge",
                      "spec": {
                        "options": {}
                      }
                    },
                    {
                      "kind": "Transformation",
                      "group": "organize",
                      "spec": {
                        "options": {
                          "excludeByName": {
                            "Time": true,
                            "__name__": true,
                            "container": true,
                            "endpoint": true,
                            "instance": true,
                            "job": true,
                            "namespace": true,
                            "pod": true,
                            "service": true
                          },
                          "indexByName": {
                            "Value #A": 1,
                            "Value #B": 2,
                            "Value #C": 3,
                            "recurring_job": 0
                          },
                          "renameByName": {
                            "Value #A": "Backups",
                            "Value #B": "Failed",
                            "Value #C": "Total Size",
                            "recurring_job": "Recurring Job"
                          }
                        }
                      }
                    }
                  ],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "table",
                "version": "13.0.1",
                "spec": {
                  "options": {
                    "cellHeight": "sm",
                    "showHeader": true
                  },
                  "fieldConfig": {
                    "defaults": {
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "value": 0,
                            "color": "green"
                          }
                        ]
                      },
                      "custom": {
                        "align": "auto",
                        "cellOptions": {
                          "type": "auto"
                        },
                        "footer": {
                          "reducers": []
                        },
                        "inspect": false
                      }
                    },
                    "overrides": [
                      {
                        "matcher": {
                          "id": "byName",
                          "options": "Recurring Job"
                        },
                        "properties": [
                          {
                            "id": "custom.width",
                            "value": 220
                          }
                        ]
                      },
                      {
                        "matcher": {
                          "id": "byName",
                          "options": "Total Size"
                        },
                        "properties": [
                          {
                            "id": "unit",
                            "value": "bytes"
                          }
                        ]
                      },
                      {
                        "matcher": {
                          "id": "byName",
                          "options": "Failed"
