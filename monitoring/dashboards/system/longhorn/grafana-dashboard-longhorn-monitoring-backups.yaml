              },
              "regex": "",
              "sort": "alphabeticalAsc",
              "definition": "label_values(longhorn_volume_state, pvc_namespace)",
              "options": [],
              "multi": true,
              "includeAll": true,
              "allValue": ".*",
              "allowCustomValue": true
