          "panel-112": {
            "kind": "Panel",
            "spec": {
              "id": 112,
              "title": "Backup Jobs Needing Attention",
              "description": "Longhorn Backup CRs currently in Error (4) or Unknown (5) state, mapped to their PVC. Filtered by Backup Job + Namespace/PVC. Backup CR names (generic UIDs) are omitted; recurring_job shows which schedule produced it ('' = manual/on-demand).",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "expr": "(\n  (longhorn_backup_state{recurring_job=~\"$recurring_job\"} >= 4)\n  * on(volume) group_left(pvc, pvc_namespace) (max by(volume, pvc, pvc_namespace)(longhorn_volume_capacity_bytes) > bool 0)\n)\nand on(volume) longhorn_volume_last_backup_at{pvc!=\"\",pvc_namespace=~\"$namespace\",pvc=~\"$pvc\"}",
                            "format": "table",
                            "instant": true
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [
                    {
                      "kind": "Transformation",
                      "group": "organize",
                      "spec": {
                        "options": {
                          "excludeByName": {
                            "Time": true,
                            "__name__": true,
                            "backup": true,
                            "container": true,
                            "endpoint": true,
                            "instance": true,
                            "job": true,
                            "namespace": true,
                            "node": true,
                            "pod": true,
                            "service": true,
                            "volume": true
                          },
                          "indexByName": {
                            "Value": 3,
                            "pvc": 1,
                            "pvc_namespace": 0,
                            "recurring_job": 2
                          },
                          "renameByName": {
                            "Value": "State",
                            "pvc": "PVC",
                            "pvc_namespace": "Namespace",
                            "recurring_job": "Recurring Job"
                          }
                        }
                      }
                    }
                  ],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "table",
                "version": "13.0.1",
                "spec": {
                  "options": {
                    "cellHeight": "sm",
                    "showHeader": true
                  },
                  "fieldConfig": {
                    "defaults": {
                      "mappings": [
                        {
                          "type": "value",
                          "options": {
                            "0": {
                              "text": "New",
                              "color": "blue",
                              "index": 0
                            },
                            "1": {
                              "text": "Pending",
                              "color": "orange",
                              "index": 1
                            },
                            "2": {
                              "text": "InProgress",
                              "color": "yellow",
                              "index": 2
                            },
                            "3": {
                              "text": "Completed",
                              "color": "green",
