          "panel-30": {
            "kind": "Panel",
            "spec": {
              "id": 30,
              "title": "Total Gratuitous Sends Ranked (per VIP) \u2014 bar length = failover severity",
              "description": "Descending rank of raw, cumulative gratuitous packets sent by each MetalLB speaker/VIP. Immediately exposes which VIP or host node is generating the highest volume of unsolicited network table updates.\n\nHow to interpret values over 25,000 (25k):\n\u2022 Healthy (slow accumulation): if 25k took weeks of continuous uptime to reach, it's normal background maintenance behavior.\n\u2022 Critical (rapid vertical spike): if the counter reaches 25k within minutes or hours, a critical network failure is occurring.\n\nCommon causes of rapid 25k+ spikes:\n1. Micro-failover storms \u2014 an app pod crash-looping, forcing MetalLB to migrate the VIP back and forth endlessly.\n2. Split-brain routing \u2014 a physical network partition causing multiple nodes to believe they're the active leader simultaneously, fighting for control of the IP.\n\nFormula: sort_desc(metallb_layer2_gratuitous_sent)",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "VictoriaMetrics"
                          },
                          "spec": {
                            "expr": "sort_desc(metallb_layer2_gratuitous_sent)",
                            "instant": true,
                            "legendFormat": "{{ip}}"
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "bargauge",
                "version": "",
                "spec": {
                  "options": {
                    "displayMode": "gradient",
                    "minVizHeight": 10,
                    "minVizWidth": 0,
                    "namePlacement": "auto",
                    "orientation": "horizontal",
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "showUnfilled": true,
                    "valueMode": "color"
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "short",
                      "min": 0,
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "value": null,
                            "color": "green"
                          },
                          {
                            "value": 5000,
                            "color": "yellow"
                          },
                          {
                            "value": 25000,
                            "color": "red"
                          }
                        ]
                      },
                      "color": {
                        "mode": "thresholds"
                      }
                    },
                    "overrides": []
