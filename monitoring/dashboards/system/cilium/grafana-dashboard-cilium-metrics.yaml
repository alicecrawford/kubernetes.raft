                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${DS_PROMETHEUS}"
                          },
                          "spec": {
                            "expr": "min(cilium_proxy_redirects{k8s_app=\"cilium\", pod=~\"$pod\"}) by (pod)",
                            "format": "time_series",
                            "intervalFactor": 1,
                            "legendFormat": "min"
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${DS_PROMETHEUS}"
                          },
                          "spec": {
                            "expr": "avg(cilium_proxy_redirects{k8s_app=\"cilium\", pod=~\"$pod\"}) by (pod)",
                            "format": "time_series",
