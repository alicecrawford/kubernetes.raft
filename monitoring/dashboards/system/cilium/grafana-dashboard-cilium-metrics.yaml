              "query": {
                "kind": "DataQuery",
                "group": "datasource",
                "version": "v0",
                "datasource": {
                  "name": "grafana"
                },
                "spec": {}
              },
              "enable": true,
              "hide": true,
              "iconColor": "rgba(0, 211, 255, 1)",
              "name": "Annotations & Alerts",
              "builtIn": true,
              "legacyOptions": {
                "type": "dashboard"
              }
            }
          }
        ],
        "cursorSync": "Crosshair",
        "description": "Dashboard for Cilium (https://cilium.io/) metrics",
        "editable": true,
