                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "$datasource"
                          },
                          "spec": {
                            "expr": "sum(etcd_server_has_leader{job=~\".*etcd.*\",polycule=~\"$cluster\"}) by(polycule)",
                            "legendFormat": "{{cluster}} - {{namespace}}\n"
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {
                    "interval": "1m"
                  }
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "stat",
                "version": "v10.0.0",
