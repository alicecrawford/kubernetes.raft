apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-k8s-views-pods
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
  annotations: {}
data:
  grafana-dashboard-k8s-views-pods.json: |-
    {
      "apiVersion": "dashboard.grafana.app/v2",
      "kind": "Dashboard",
      "metadata": {
        "name": "k8s_views_pods",
        "namespace": "default"
      },
      "spec": {
        "annotations": [
          {
            "kind": "AnnotationQuery",
            "spec": {
              "query": {
                "kind": "DataQuery",
                "group": "datasource",
                "version": "v0",
                "datasource": {
                  "name": "grafana"
                },
                "spec": {
                  "limit": 100,
                  "matchAny": false,
                  "tags": [],
                  "type": "dashboard"
                }
              },
              "enable": true,
              "hide": true,
              "iconColor": "rgba(0, 211, 255, 1)",
              "name": "Annotations & Alerts",
              "builtIn": true,
              "legacyOptions": {
                "type": "dashboard"
              }
            }
          },
          {
            "kind": "AnnotationQuery",
            "spec": {
              "query": {
                "kind": "DataQuery",
                "group": "datasource",
                "version": "v0",
                "datasource": {
                  "name": "grafana"
                },
                "spec": {
                  "limit": 100,
                  "matchAny": false,
                  "tags": [
                    "terraform"
                  ],
                  "type": "tags"
                }
              },
              "enable": true,
              "hide": false,
              "iconColor": "#5c4ee5",
              "name": "terraform"
            }
          },
          {
            "kind": "AnnotationQuery",
            "spec": {
              "query": {
                "kind": "DataQuery",
                "group": "datasource",
                "version": "v0",
                "datasource": {
                  "name": "grafana"
                },
                "spec": {
                  "limit": 100,
                  "matchAny": false,
                  "tags": [
                    "oncall"
                  ],
                  "type": "tags"
                }
              },
              "enable": true,
              "hide": false,
              "iconColor": "red",
              "name": "oncall"
            }
          }
        ],
        "cursorSync": "Crosshair",
        "description": "This is a modern 'Pods View' dashboard for your Kubernetes cluster(s). Made for kube-prometheus-stack and take advantage of the latest Grafana features. GitHub repository: https://github.com/dotdc/grafana-dashboards-kubernetes",
        "editable": false,
        "elements": {
          "panel-2": {
            "kind": "Panel",
            "spec": {
              "id": 2,
              "title": "Created by",
              "description": "Panel only works when a single pod is selected.",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "editorMode": "code",
                            "exemplar": false,
                            "expr": "kube_pod_info{namespace=\"$namespace\",pod=~\"$pod\",polycule=~\"$cluster\"}",
                            "instant": true,
                            "interval": "",
                            "legendFormat": "{{ created_by_kind }}: {{ created_by_name }}"
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "stat",
                "version": "12.2.1",
                "spec": {
                  "options": {
                    "colorMode": "none",
                    "graphMode": "none",
                    "justifyMode": "auto",
                    "orientation": "auto",
                    "percentChangeColorMode": "standard",
                    "reduceOptions": {
                      "calcs": [
                        "mean"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "showPercentChange": false,
                    "textMode": "name",
                    "wideLayout": true
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "none",
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "value": 0,
                            "color": "rgb(255, 255, 255)"
                          }
                        ]
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
          "panel-29": {
            "kind": "Panel",
            "spec": {
              "id": 29,
              "title": "CPU Usage by container",
              "description": "",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "editorMode": "code",
                            "exemplar": true,
                            "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"$namespace\",pod=~\"$pod\",image!=\"\",container!=\"\",polycule=~\"$cluster\"}[$__rate_interval])) by(container,id,polycule)",
                            "interval": "$resolution",
                            "legendFormat": "{{ container }}",
                            "range": true
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "12.2.1",
                "spec": {
                  "options": {
                    "legend": {
                      "calcs": [
                        "min",
                        "max",
                        "mean"
                      ],
                      "displayMode": "table",
                      "placement": "right",
                      "showLegend": true
                    },
                    "tooltip": {
                      "hideZeros": false,
                      "mode": "multi",
                      "sort": "desc"
                    }
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "none",
                      "decimals": 4,
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "value": 0,
                            "color": "green"
                          },
                          {
                            "value": 80,
                            "color": "red"
                          }
                        ]
                      },
                      "color": {
                        "mode": "palette-classic"
                      },
                      "custom": {
                        "axisBorderShow": false,
                        "axisCenteredZero": false,
                        "axisColorMode": "text",
                        "axisLabel": "CPU Cores",
                        "axisPlacement": "auto",
                        "barAlignment": 0,
                        "barWidthFactor": 0.6,
                        "drawStyle": "line",
                        "fillOpacity": 25,
                        "gradientMode": "opacity",
                        "hideFrom": {
                          "legend": false,
                          "tooltip": false,
                          "viz": false
                        },
                        "insertNulls": false,
                        "lineInterpolation": "smooth",
                        "lineWidth": 2,
                        "pointSize": 5,
                        "scaleDistribution": {
                          "type": "linear"
                        },
                        "showPoints": "never",
                        "showValues": false,
                        "spanNulls": false,
                        "stacking": {
                          "group": "A",
                          "mode": "none"
                        },
                        "thresholdsStyle": {
                          "mode": "off"
                        }
                      }
                    },
                    "overrides": [
                      {
                        "matcher": {
                          "id": "byName",
                          "options": "limit"
                        },
                        "properties": [
                          {
                            "id": "color",
                            "value": {
                              "fixedColor": "#F2495C",
                              "mode": "fixed"
                            }
                          },
                          {
                            "id": "custom.fillOpacity",
                            "value": 0
                          }
                        ]
                      }
                    ]
                  }
                }
              }
            }
          },
          "panel-30": {
            "kind": "Panel",
            "spec": {
              "id": 30,
              "title": "Memory Usage / Requests & Limits by container",
              "description": "",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "editorMode": "code",
                            "exemplar": true,
                            "expr": "sum(container_memory_working_set_bytes{namespace=\"$namespace\",pod=~\"$pod\",image!=\"\",polycule=~\"$cluster\"}) by(container,polycule) / sum(kube_pod_container_resource_requests{namespace=\"$namespace\",pod=~\"$pod\",resource=\"memory\",job=~\"$job\",polycule=~\"$cluster\"} and on(namespace,pod,polycule) max(kube_pod_status_phase{phase=\"Running\",namespace=\"$namespace\",pod=~\"$pod\",job=~\"$job\",polycule=~\"$cluster\"} == 1) by(namespace,pod,polycule)) by(container,polycule)",
                            "interval": "",
                            "legendFormat": "{{ container }} REQUESTS",
                            "range": true
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "editorMode": "code",
                            "expr": "sum(container_memory_working_set_bytes{namespace=\"$namespace\",pod=~\"$pod\",image!=\"\",polycule=~\"$cluster\"}) by(container,polycule) / sum(kube_pod_container_resource_limits{namespace=\"$namespace\",pod=~\"$pod\",resource=\"memory\",job=~\"$job\",polycule=~\"$cluster\"} and on(namespace,pod,polycule) max(kube_pod_status_phase{phase=\"Running\",namespace=\"$namespace\",pod=~\"$pod\",job=~\"$job\",polycule=~\"$cluster\"} == 1) by(namespace,pod,polycule)) by(container,polycule)",
                            "legendFormat": "{{ container }} LIMITS",
                            "range": true
                          }
                        },
                        "refId": "B",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "12.2.1",
                "spec": {
                  "options": {
                    "legend": {
                      "calcs": [],
                      "displayMode": "table",
                      "placement": "right",
                      "showLegend": true
                    },
                    "tooltip": {
                      "hideZeros": false,
                      "mode": "multi",
                      "sort": "desc"
                    }
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "percentunit",
                      "min": 0,
                      "max": 1,
                      "thresholds": {
                        "mode": "percentage",
                        "steps": [
                          {
                            "value": 0,
                            "color": "red"
                          },
                          {
                            "value": 20,
                            "color": "yellow"
                          },
                          {
                            "value": 30,
                            "color": "green"
                          },
                          {
                            "value": 70,
                            "color": "#EAB839"
                          },
                          {
                            "value": 80,
                            "color": "red"
                          }
                        ]
                      },
                      "color": {
                        "mode": "thresholds",
                        "fixedColor": "blue"
                      },
                      "custom": {
                        "axisBorderShow": false,
                        "axisCenteredZero": false,
                        "axisColorMode": "text",
                        "axisLabel": "Percent",
                        "axisPlacement": "auto",
                        "barAlignment": 0,
                        "barWidthFactor": 0.6,
                        "drawStyle": "line",
                        "fillOpacity": 25,
                        "gradientMode": "opacity",
                        "hideFrom": {
                          "legend": false,
                          "tooltip": false,
                          "viz": false
                        },
                        "insertNulls": false,
                        "lineInterpolation": "smooth",
                        "lineStyle": {
                          "fill": "solid"
                        },
                        "lineWidth": 2,
                        "pointSize": 5,
                        "scaleDistribution": {
                          "type": "linear"
                        },
                        "showPoints": "never",
                        "showValues": false,
                        "spanNulls": false,
                        "stacking": {
                          "group": "A",
                          "mode": "none"
                        },
                        "thresholdsStyle": {
                          "mode": "area"
                        }
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
          "panel-31": {
            "kind": "Panel",
            "spec": {
              "id": 31,
              "title": "Network - Bandwidth",
              "description": "",
