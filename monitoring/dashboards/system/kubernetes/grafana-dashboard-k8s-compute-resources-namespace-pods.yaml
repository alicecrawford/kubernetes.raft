          "panel-1": {
            "kind": "Panel",
            "spec": {
              "id": 1,
              "title": "CPU Utilisation (from requests)",
              "description": "",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "expr": "sum(max(node_namespace_pod_container:container_cpu_usage_seconds_total:sum_rate5m{polycule=~\"$cluster\",namespace=\"$namespace\"}) by(polycule,namespace,pod,container)) by(polycule) / sum(kube_pod_container_resource_requests{job=\"kube-state-metrics\",polycule=~\"$cluster\",namespace=\"$namespace\",resource=\"cpu\"}) by(polycule)",
                            "instant": true
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {
                    "interval": "1m"
                  }
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "stat",
                "version": "v13.0.0",
                "spec": {
                  "options": {
                    "colorMode": "none"
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "percentunit"
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
