apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-k8s-coredns
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
  annotations: {}
data:
  grafana-dashboard-k8s-coredns.json: |-
    {
      "apiVersion": "dashboard.grafana.app/v2",
      "kind": "Dashboard",
      "metadata": {
        "name": "k8s_system_coredns",
        "namespace": "default"
      },
      "spec": {
        "annotations": [
          {
            "kind": "AnnotationQuery",
            "spec": {
              "query": {
                "kind": "DataQuery",
                "group": "datasource",
                "version": "v0",
                "datasource": {
                  "name": "grafana"
                },
                "spec": {
                  "limit": 100,
                  "matchAny": false,
                  "tags": [],
                  "type": "dashboard"
                }
              },
              "enable": true,
              "hide": true,
              "iconColor": "rgba(0, 211, 255, 1)",
              "name": "Annotations & Alerts",
              "builtIn": true,
              "legacyOptions": {
                "type": "dashboard"
              }
            }
          },
          {
            "kind": "AnnotationQuery",
            "spec": {
              "query": {
                "kind": "DataQuery",
                "group": "datasource",
                "version": "v0",
                "datasource": {
                  "name": "grafana"
                },
                "spec": {
                  "limit": 100,
                  "matchAny": false,
                  "tags": [
                    "terraform"
                  ],
                  "type": "tags"
                }
              },
              "enable": true,
              "hide": false,
              "iconColor": "#5c4ee5",
              "name": "terraform"
            }
          },
          {
            "kind": "AnnotationQuery",
            "spec": {
              "query": {
                "kind": "DataQuery",
                "group": "datasource",
                "version": "v0",
                "datasource": {
                  "name": "grafana"
                },
                "spec": {
                  "limit": 100,
                  "matchAny": false,
                  "tags": [
                    "oncall"
                  ],
                  "type": "tags"
                }
              },
              "enable": true,
              "hide": false,
              "iconColor": "red",
              "name": "oncall"
            }
          }
        ],
        "cursorSync": "Crosshair",
        "description": "This is a modern CoreDNS dashboard for your Kubernetes cluster(s). Made for kube-prometheus-stack and take advantage of the latest Grafana features. GitHub repository: https://github.com/dotdc/grafana-dashboards-kubernetes",
        "editable": false,
        "elements": {
          "panel-13": {
            "kind": "Panel",
            "spec": {
              "id": 13,
              "title": "CoreDNS - DNS Errors",
              "description": "",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "exemplar": true,
                            "expr": "sum(rate(coredns_proxy_request_duration_seconds_count{proxy_name=\"forward\",rcode=~\"SERVFAIL|REFUSED\",polycule=~\"$cluster\",job=~\"$job\"}[$__rate_interval])) by(rcode,polycule)",
                            "interval": "$resolution",
                            "legendFormat": "{{ rcode }}"
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "8.3.3",
                "spec": {
                  "options": {
                    "legend": {
                      "calcs": [],
                      "displayMode": "list",
                      "placement": "bottom",
                      "showLegend": true
                    },
                    "tooltip": {
                      "mode": "multi",
                      "sort": "none"
                    }
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "short",
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "value": null,
                            "color": "green"
                          },
                          {
                            "value": 80,
                            "color": "red"
                          }
                        ]
                      },
                      "color": {
                        "mode": "palette-classic"
                      },
                      "custom": {
                        "axisBorderShow": false,
                        "axisCenteredZero": false,
                        "axisColorMode": "text",
                        "axisLabel": "",
