apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-k8s-persistent-volumes
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
  annotations: {}
data:
  grafana-dashboard-k8s-persistent-volumes.json: |-
    {
      "apiVersion": "dashboard.grafana.app/v2",
      "kind": "Dashboard",
      "metadata": {
        "name": "919b92a8e8041bd567af9edab12c840c",
        "namespace": "default"
      },
      "spec": {
        "annotations": [
          {
            "kind": "AnnotationQuery",
            "spec": {
              "query": {
                "kind": "DataQuery",
                "group": "grafana",
                "version": "v0",
                "datasource": {
                  "name": "-- Grafana --"
                },
                "spec": {}
              },
              "enable": true,
              "hide": true,
              "iconColor": "rgba(0, 211, 255, 1)",
              "name": "Annotations & Alerts",
              "builtIn": true,
              "legacyOptions": {
                "type": "dashboard"
              }
            }
          }
        ],
        "cursorSync": "Off",
        "editable": false,
        "elements": {
          "panel-1": {
            "kind": "Panel",
            "spec": {
              "id": 1,
              "title": "Volume Space Usage",
              "description": "",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "expr": "sum(topk(1, kubelet_volume_stats_capacity_bytes{polycule=~\"$cluster\",job=\"kubelet\",metrics_path=\"/metrics\",namespace=\"$namespace\",persistentvolumeclaim=\"$volume\"}) by(polycule)) without(instance,node) - sum(topk(1, kubelet_volume_stats_available_bytes{polycule=~\"$cluster\",job=\"kubelet\",metrics_path=\"/metrics\",namespace=\"$namespace\",persistentvolumeclaim=\"$volume\"}) by(polycule)) without(instance,node)",
                            "legendFormat": "Used Space"
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "expr": "sum(topk(1, kubelet_volume_stats_available_bytes{polycule=~\"$cluster\",job=\"kubelet\",metrics_path=\"/metrics\",namespace=\"$namespace\",persistentvolumeclaim=\"$volume\"}) by(polycule)) without(instance,node)",
                            "legendFormat": "Free Space"
                          }
                        },
                        "refId": "B",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {
                    "interval": "1m"
                  }
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "v13.0.0",
                "spec": {
                  "options": {
                    "legend": {
                      "asTable": true,
                      "calcs": [
                        "lastNotNull"
                      ],
                      "displayMode": "table",
                      "placement": "right",
                      "showLegend": true
                    },
                    "tooltip": {
                      "mode": "single"
                    }
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "bytes",
                      "custom": {
                        "fillOpacity": 10,
                        "showPoints": "never",
                        "spanNulls": true
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
          "panel-2": {
            "kind": "Panel",
            "spec": {
              "id": 2,
              "title": "Volume Space Usage",
              "description": "",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "expr": "max(((topk(1, kubelet_volume_stats_capacity_bytes{polycule=~\"$cluster\",job=\"kubelet\",metrics_path=\"/metrics\",namespace=\"$namespace\",persistentvolumeclaim=\"$volume\"}) by(polycule) - topk(1, kubelet_volume_stats_available_bytes{polycule=~\"$cluster\",job=\"kubelet\",metrics_path=\"/metrics\",namespace=\"$namespace\",persistentvolumeclaim=\"$volume\"}) by(polycule)) / topk(1, kubelet_volume_stats_capacity_bytes{polycule=~\"$cluster\",job=\"kubelet\",metrics_path=\"/metrics\",namespace=\"$namespace\",persistentvolumeclaim=\"$volume\"}) by(polycule)) * 100) without(instance,node)",
                            "instant": true
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {
                    "interval": "1m"
                  }
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "gauge",
                "version": "v13.0.0",
                "spec": {
                  "options": {},
                  "fieldConfig": {
                    "defaults": {
                      "unit": "percent",
                      "min": 0,
                      "max": 100,
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "value": 0,
                            "color": "green"
                          },
                          {
                            "value": 80,
                            "color": "orange"
                          },
                          {
                            "value": 90,
                            "color": "red"
                          }
                        ]
                      },
                      "color": {
                        "mode": "thresholds"
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
          "panel-3": {
            "kind": "Panel",
            "spec": {
              "id": 3,
              "title": "Volume inodes Usage",
              "description": "",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "expr": "sum(topk(1, kubelet_volume_stats_inodes_used{polycule=~\"$cluster\",job=\"kubelet\",metrics_path=\"/metrics\",namespace=\"$namespace\",persistentvolumeclaim=\"$volume\"}) by(polycule)) without(instance,node)",
                            "legendFormat": "Used inodes"
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "expr": "sum(topk(1, kubelet_volume_stats_inodes{polycule=~\"$cluster\",job=\"kubelet\",metrics_path=\"/metrics\",namespace=\"$namespace\",persistentvolumeclaim=\"$volume\"}) by(polycule)) without(instance,node) - sum(topk(1, kubelet_volume_stats_inodes_used{polycule=~\"$cluster\",job=\"kubelet\",metrics_path=\"/metrics\",namespace=\"$namespace\",persistentvolumeclaim=\"$volume\"}) by(polycule)) without(instance,node)",
                            "legendFormat": "Free inodes"
                          }
                        },
                        "refId": "B",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {
                    "interval": "1m"
                  }
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "v13.0.0",
                "spec": {
                  "options": {
                    "legend": {
                      "asTable": true,
                      "calcs": [
                        "lastNotNull"
                      ],
                      "displayMode": "table",
                      "placement": "right",
                      "showLegend": true
                    },
                    "tooltip": {
                      "mode": "single"
                    }
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "none",
                      "custom": {
                        "fillOpacity": 10,
                        "showPoints": "never",
                        "spanNulls": true
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
          "panel-4": {
            "kind": "Panel",
            "spec": {
              "id": 4,
              "title": "Volume inodes Usage",
              "description": "",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "expr": "max((topk(1, kubelet_volume_stats_inodes_used{polycule=~\"$cluster\",job=\"kubelet\",metrics_path=\"/metrics\",namespace=\"$namespace\",persistentvolumeclaim=\"$volume\"}) by(polycule) / topk(1, kubelet_volume_stats_inodes{polycule=~\"$cluster\",job=\"kubelet\",metrics_path=\"/metrics\",namespace=\"$namespace\",persistentvolumeclaim=\"$volume\"}) by(polycule)) * 100) without(instance,node)",
                            "instant": true
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {
                    "interval": "1m"
                  }
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "gauge",
                "version": "v13.0.0",
                "spec": {
                  "options": {},
                  "fieldConfig": {
                    "defaults": {
                      "unit": "percent",
                      "min": 0,
                      "max": 100,
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "value": 0,
                            "color": "green"
                          },
                          {
                            "value": 80,
                            "color": "orange"
                          },
                          {
                            "value": 90,
                            "color": "red"
                          }
                        ]
                      },
                      "color": {
                        "mode": "thresholds"
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          }
        },
        "layout": {
          "kind": "GridLayout",
          "spec": {
            "items": [
              {
                "kind": "GridLayoutItem",
                "spec": {
                  "x": 0,
                  "y": 0,
                  "width": 18,
                  "height": 7,
                  "element": {
                    "kind": "ElementReference",
                    "name": "panel-1"
                  }
                }
              },
              {
                "kind": "GridLayoutItem",
                "spec": {
                  "x": 18,
                  "y": 0,
                  "width": 6,
                  "height": 7,
                  "element": {
                    "kind": "ElementReference",
                    "name": "panel-2"
                  }
                }
              },
              {
                "kind": "GridLayoutItem",
                "spec": {
                  "x": 0,
                  "y": 7,
                  "width": 18,
                  "height": 7,
                  "element": {
                    "kind": "ElementReference",
                    "name": "panel-3"
                  }
                }
              },
              {
                "kind": "GridLayoutItem",
                "spec": {
                  "x": 18,
                  "y": 7,
                  "width": 6,
                  "height": 7,
                  "element": {
                    "kind": "ElementReference",
                    "name": "panel-4"
                  }
                }
              }
            ]
          }
        },
        "links": [
          {
            "title": "Kubernetes",
            "type": "dashboards",
            "icon": "",
            "tooltip": "",
            "tags": [
              "kubernetes-mixin"
            ],
            "asDropdown": true,
            "targetBlank": false,
            "includeVars": true,
            "keepTime": true
          }
        ],
        "liveNow": false,
        "preload": false,
        "tags": [
          "kubernetes-mixin",
          "vm-k8s-stack"
        ],
        "timeSettings": {
          "timezone": "browser",
          "from": "now-1h",
          "to": "now",
          "autoRefresh": "10s",
          "autoRefreshIntervals": [
            "5s",
            "10s",
            "30s",
            "1m",
            "5m",
            "15m",
            "30m",
            "1h",
            "2h",
            "1d"
          ],
          "hideTimepicker": false,
          "fiscalYearStartMonth": 0
        },
        "title": "Persistent Volumes",
        "variables": [
          {
            "kind": "DatasourceVariable",
            "spec": {
              "name": "datasource",
              "pluginId": "prometheus",
              "refresh": "never",
              "regex": "",
              "current": {
                "text": "default",
                "value": "default"
              },
              "options": [],
              "multi": false,
              "includeAll": false,
              "label": "Data source",
              "hide": "dontHide",
              "skipUrlSync": false,
              "allowCustomValue": true
            }
          },
          {
            "kind": "ConstantVariable",
            "spec": {
              "name": "cluster",
              "query": ".*",
              "current": {
                "text": ".*",
                "value": ".*"
              },
              "label": "cluster",
              "hide": "hideVariable",
              "skipUrlSync": false
            }
          },
          {
            "kind": "QueryVariable",
            "spec": {
              "name": "namespace",
              "current": {
                "text": "",
                "value": ""
              },
              "label": "Namespace",
              "hide": "dontHide",
              "refresh": "onTimeRangeChanged",
              "skipUrlSync": false,
              "query": {
                "kind": "DataQuery",
                "group": "prometheus",
                "version": "v0",
                "datasource": {
                  "name": "${datasource}"
                },
                "spec": {
                  "__legacyStringValue": "label_values(kubelet_volume_stats_capacity_bytes{polycule=~\"$cluster\",job=\"kubelet\",metrics_path=\"/metrics\"}, namespace)"
                }
              },
              "regex": "",
              "sort": "alphabeticalAsc",
              "options": [],
              "multi": false,
              "includeAll": false,
              "allowCustomValue": true
            }
          },
          {
            "kind": "QueryVariable",
            "spec": {
              "name": "volume",
              "current": {
                "text": "",
                "value": ""
              },
              "label": "PersistentVolumeClaim",
              "hide": "dontHide",
              "refresh": "onTimeRangeChanged",
              "skipUrlSync": false,
              "query": {
                "kind": "DataQuery",
                "group": "prometheus",
                "version": "v0",
                "datasource": {
                  "name": "${datasource}"
                },
                "spec": {
                  "__legacyStringValue": "label_values(kubelet_volume_stats_capacity_bytes{polycule=~\"$cluster\",job=\"kubelet\",metrics_path=\"/metrics\",namespace=\"$namespace\"}, persistentvolumeclaim)"
                }
              },
              "regex": "",
              "sort": "alphabeticalAsc",
              "options": [],
              "multi": false,
              "includeAll": false,
              "allowCustomValue": true
            }
          }
        ]
      }
    }
