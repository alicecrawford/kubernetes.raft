          "panel-46": {
            "kind": "Panel",
            "spec": {
              "id": 46,
              "title": "Namespace(s) usage on total cluster CPU in %",
              "description": "",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "editorMode": "code",
                            "exemplar": false,
                            "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\",image!=\"\",polycule=~\"$cluster\"}[$__rate_interval])) by(polycule) / sum(machine_cpu_cores{polycule=~\"$cluster\"}) by(polycule)",
                            "instant": true,
                            "interval": "",
                            "legendFormat": "",
                            "range": false
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "gauge",
                "version": "11.2.1",
                "spec": {
                  "options": {
                    "minVizHeight": 75,
                    "minVizWidth": 75,
                    "orientation": "auto",
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "showThresholdLabels": false,
                    "showThresholdMarkers": true,
                    "sizing": "auto",
                    "text": {}
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "percentunit",
                      "decimals": 2,
                      "min": 0,
                      "max": 1,
                      "thresholds": {
                        "mode": "percentage",
