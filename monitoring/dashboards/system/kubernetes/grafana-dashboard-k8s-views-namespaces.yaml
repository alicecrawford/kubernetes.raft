apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-k8s-views-namespaces
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
  annotations: {}
data:
  grafana-dashboard-k8s-views-namespaces.json: |-
    {
      "apiVersion": "dashboard.grafana.app/v2",
      "kind": "Dashboard",
      "metadata": {
        "name": "k8s_views_ns",
        "namespace": "default"
      },
      "spec": {
        "annotations": [
          {
            "kind": "AnnotationQuery",
            "spec": {
              "query": {
                "kind": "DataQuery",
                "group": "datasource",
                "version": "v0",
                "datasource": {
                  "name": "grafana"
                },
                "spec": {
                  "limit": 100,
                  "matchAny": false,
                  "tags": [],
                  "type": "dashboard"
                }
              },
              "enable": true,
              "hide": true,
              "iconColor": "rgba(0, 211, 255, 1)",
              "name": "Annotations & Alerts",
              "builtIn": true,
              "legacyOptions": {
                "type": "dashboard"
              }
            }
          },
          {
            "kind": "AnnotationQuery",
            "spec": {
              "query": {
                "kind": "DataQuery",
                "group": "datasource",
                "version": "v0",
                "datasource": {
                  "name": "grafana"
                },
                "spec": {
                  "limit": 100,
                  "matchAny": false,
                  "tags": [
                    "terraform"
                  ],
                  "type": "tags"
                }
              },
              "enable": true,
              "hide": false,
              "iconColor": "#5c4ee5",
              "name": "terraform"
            }
          },
          {
            "kind": "AnnotationQuery",
            "spec": {
              "query": {
                "kind": "DataQuery",
                "group": "datasource",
                "version": "v0",
                "datasource": {
                  "name": "grafana"
                },
                "spec": {
                  "limit": 100,
                  "matchAny": false,
                  "tags": [
                    "oncall"
                  ],
                  "type": "tags"
                }
              },
              "enable": true,
              "hide": false,
              "iconColor": "red",
              "name": "oncall"
            }
          }
        ],
        "cursorSync": "Crosshair",
        "description": "This is a modern 'Namespaces View' dashboard for your Kubernetes cluster(s). Made for kube-prometheus-stack and take advantage of the latest Grafana features. GitHub repository: https://github.com/dotdc/grafana-dashboards-kubernetes",
        "editable": false,
        "elements": {
          "panel-2": {
            "kind": "Panel",
            "spec": {
              "id": 2,
              "title": "Nb of containers by pod",
              "description": "",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "editorMode": "code",
                            "expr": "sum(kube_pod_container_info{namespace=~\"$namespace\",pod=~\"${created_by}.*\",polycule=~\"$cluster\"}) by(pod,polycule)",
                            "interval": "",
                            "legendFormat": "{{ pod }}",
                            "range": true
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "8.3.3",
                "spec": {
                  "options": {
                    "legend": {
                      "calcs": [],
                      "displayMode": "hidden",
                      "placement": "right",
                      "showLegend": false
                    },
                    "tooltip": {
                      "mode": "multi",
                      "sort": "none"
                    }
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "none",
                      "decimals": 0,
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "value": null,
                            "color": "green"
                          },
                          {
                            "value": 80,
                            "color": "red"
                          }
                        ]
                      },
                      "color": {
                        "mode": "palette-classic"
                      },
                      "custom": {
                        "axisBorderShow": false,
                        "axisCenteredZero": false,
                        "axisColorMode": "text",
                        "axisLabel": "",
                        "axisPlacement": "auto",
                        "barAlignment": 0,
                        "barWidthFactor": 0.6,
                        "drawStyle": "line",
                        "fillOpacity": 25,
                        "gradientMode": "opacity",
                        "hideFrom": {
                          "legend": false,
                          "tooltip": false,
                          "viz": false
                        },
                        "insertNulls": false,
                        "lineInterpolation": "smooth",
                        "lineWidth": 2,
                        "pointSize": 5,
                        "scaleDistribution": {
                          "type": "linear"
                        },
                        "showPoints": "never",
                        "spanNulls": false,
                        "stacking": {
                          "group": "A",
                          "mode": "none"
                        },
                        "thresholdsStyle": {
                          "mode": "off"
                        }
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
          "panel-27": {
