                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "exemplar": true,
                            "expr": "sum(rate(apiserver_request_total{polycule=~\"$cluster\"}[$__rate_interval])) by(code,polycule)",
                            "interval": "$resolution",
                            "legendFormat": "{{ code }}"
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
