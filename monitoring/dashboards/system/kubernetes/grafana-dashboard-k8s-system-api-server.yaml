              "query": {
                "kind": "DataQuery",
                "group": "datasource",
                "version": "v0",
                "datasource": {
                  "name": "grafana"
                },
                "spec": {
                  "limit": 100,
                  "matchAny": false,
                  "tags": [],
                  "type": "dashboard"
                }
              },
              "enable": true,
              "hide": true,
              "iconColor": "rgba(0, 211, 255, 1)",
              "name": "Annotations & Alerts",
              "builtIn": true,
              "legacyOptions": {
                "type": "dashboard"
              }
            }
          },
          {
            "kind": "AnnotationQuery",
            "spec": {
              "query": {
                "kind": "DataQuery",
                "group": "datasource",
                "version": "v0",
                "datasource": {
                  "name": "grafana"
                },
                "spec": {
                  "limit": 100,
                  "matchAny": false,
                  "tags": [
                    "terraform"
                  ],
                  "type": "tags"
                }
              },
              "enable": true,
              "hide": false,
              "iconColor": "#5c4ee5",
              "name": "terraform"
            }
          },
          {
            "kind": "AnnotationQuery",
            "spec": {
              "query": {
                "kind": "DataQuery",
                "group": "datasource",
                "version": "v0",
                "datasource": {
                  "name": "grafana"
                },
                "spec": {
                  "limit": 100,
                  "matchAny": false,
                  "tags": [
                    "oncall"
                  ],
                  "type": "tags"
                }
              },
              "enable": true,
              "hide": false,
              "iconColor": "red",
              "name": "oncall"
            }
          }
        ],
        "cursorSync": "Crosshair",
        "description": "This is a modern API Server dashboard for your Kubernetes cluster(s). Made for kube-prometheus-stack and take advantage of the latest Grafana features. GitHub repository: https://github.com/dotdc/grafana-dashboards-kubernetes",
