                    "tooltip": {
                      "mode": "single"
                    }
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "percentunit",
                      "custom": {
                        "fillOpacity": 10,
                        "showPoints": "never",
                        "spanNulls": true
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          }
