apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-k8s-compute-resources-nodes-overview
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
  annotations: {}
data:
  grafana-dashboard-k8s-compute-resources-nodes-overview.json: |-
    {
      "apiVersion": "dashboard.grafana.app/v2",
      "kind": "Dashboard",
      "metadata": {
        "name": "058020e04168bfdea0c52269cb699df2",
        "namespace": "default"
      },
      "spec": {
        "annotations": [
          {
            "kind": "AnnotationQuery",
            "spec": {
              "query": {
                "kind": "DataQuery",
                "group": "grafana",
                "version": "v0",
                "datasource": {
                  "name": "-- Grafana --"
                },
                "spec": {}
              },
              "enable": true,
              "hide": true,
              "iconColor": "rgba(0, 211, 255, 1)",
              "name": "Annotations & Alerts",
              "builtIn": true,
              "legacyOptions": {
                "type": "dashboard"
              }
            }
          }
        ],
        "cursorSync": "Off",
        "editable": false,
        "elements": {
          "panel-1": {
            "kind": "Panel",
            "spec": {
              "id": 1,
              "title": "Node & Pod Count",
              "description": "",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "expr": "count(kube_node_info{polycule=~\"$cluster\",job=\"kube-state-metrics\"}) by(polycule)",
                            "legendFormat": "nodes"
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "expr": "sum(kubelet_running_pods{polycule=~\"$cluster\",job=\"kubelet\",metrics_path=\"/metrics\"}) by(polycule)",
                            "legendFormat": "pods"
                          }
                        },
                        "refId": "B",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {
                    "interval": "1m"
                  }
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "v13.0.0",
                "spec": {
                  "options": {
                    "legend": {
                      "asTable": true,
                      "calcs": [
                        "lastNotNull"
                      ],
                      "displayMode": "table",
                      "placement": "right",
                      "showLegend": true
                    },
                    "tooltip": {
                      "mode": "single"
                    }
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "short",
                      "decimals": 0,
                      "custom": {
                        "fillOpacity": 0,
                        "showPoints": "never",
                        "spanNulls": true
                      }
                    },
                    "overrides": [
                      {
                        "matcher": {
                          "id": "byName",
                          "options": "pods"
                        },
                        "properties": [
                          {
                            "id": "custom.axisPlacement",
                            "value": "right"
                          },
                          {
                            "id": "custom.axisSoftMin",
                            "value": 0
                          }
                        ]
                      }
                    ]
                  }
                }
              }
            }
          },
          "panel-2": {
            "kind": "Panel",
            "spec": {
              "id": 2,
              "title": "CPU Usage",
              "description": "",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "expr": "sum(kube_node_status_allocatable{polycule=~\"$cluster\",job=\"kube-state-metrics\",resource=\"cpu\"}) by(polycule)",
                            "legendFormat": "allocatable"
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "expr": "sum(cluster:namespace:pod_cpu:active:kube_pod_container_resource_requests{polycule=~\"$cluster\"}) by(polycule)",
                            "legendFormat": "requests"
                          }
                        },
                        "refId": "B",
                        "hidden": false
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "expr": "sum(node_namespace_pod_container:container_cpu_usage_seconds_total:sum_rate5m{polycule=~\"$cluster\"}) by(polycule)",
                            "legendFormat": "usage"
                          }
                        },
                        "refId": "C",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {
                    "interval": "1m"
                  }
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "v13.0.0",
                "spec": {
                  "options": {
                    "legend": {
                      "asTable": true,
                      "calcs": [
                        "lastNotNull"
                      ],
                      "displayMode": "table",
                      "placement": "right",
                      "showLegend": true
                    },
                    "tooltip": {
                      "mode": "single"
                    }
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "short",
                      "custom": {
                        "fillOpacity": 10,
                        "showPoints": "never",
                        "spanNulls": true
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
          "panel-3": {
            "kind": "Panel",
            "spec": {
              "id": 3,
              "title": "Memory Usage",
              "description": "",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "expr": "sum(kube_node_status_allocatable{polycule=~\"$cluster\",job=\"kube-state-metrics\",resource=\"memory\"}) by(polycule)",
                            "legendFormat": "allocatable"
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "expr": "sum(cluster:namespace:pod_memory:active:kube_pod_container_resource_requests{polycule=~\"$cluster\"}) by(polycule)",
                            "legendFormat": "requests"
                          }
                        },
                        "refId": "B",
                        "hidden": false
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "expr": "sum(node_namespace_pod_container:container_memory_working_set_bytes{polycule=~\"$cluster\",container!=\"\"}) by(polycule)",
                            "legendFormat": "usage"
                          }
                        },
                        "refId": "C",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {
                    "interval": "1m"
                  }
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "v13.0.0",
                "spec": {
                  "options": {
                    "legend": {
                      "asTable": true,
                      "calcs": [
                        "lastNotNull"
                      ],
                      "displayMode": "table",
                      "placement": "right",
                      "showLegend": true
                    },
                    "tooltip": {
                      "mode": "single"
                    }
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "bytes",
                      "custom": {
                        "fillOpacity": 10,
                        "showPoints": "never",
                        "spanNulls": true
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
          "panel-4": {
            "kind": "Panel",
            "spec": {
              "id": 4,
              "title": "CPU Utilization per Node",
              "description": "",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "expr": "sum(node_namespace_pod_container:container_cpu_usage_seconds_total:sum_rate5m{polycule=~\"$cluster\"}) by(node,polycule) / sum(kube_node_status_allocatable{polycule=~\"$cluster\",job=\"kube-state-metrics\",resource=\"cpu\"}) by(node,polycule)",
                            "legendFormat": "{{node}}"
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {
                    "interval": "1m"
                  }
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "v13.0.0",
                "spec": {
                  "options": {
                    "legend": {
                      "asTable": true,
                      "calcs": [
                        "lastNotNull"
                      ],
                      "displayMode": "table",
                      "placement": "right",
                      "showLegend": true
                    },
                    "tooltip": {
                      "mode": "single"
                    }
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "percentunit",
                      "custom": {
                        "fillOpacity": 10,
                        "showPoints": "never",
                        "spanNulls": true
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
          "panel-5": {
            "kind": "Panel",
            "spec": {
              "id": 5,
              "title": "Memory Utilization per Node",
              "description": "",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "expr": "sum(node_namespace_pod_container:container_memory_working_set_bytes{polycule=~\"$cluster\",container!=\"\"}) by(node,polycule) / sum(kube_node_status_allocatable{polycule=~\"$cluster\",job=\"kube-state-metrics\",resource=\"memory\"}) by(node,polycule)",
                            "legendFormat": "{{node}}"
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {
                    "interval": "1m"
                  }
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "v13.0.0",
                "spec": {
                  "options": {
                    "legend": {
                      "asTable": true,
