                          }
                        },
                        "refId": "B",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {
                    "interval": "1m"
                  }
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "v13.0.0",
                "spec": {
                  "options": {
                    "legend": {
                      "asTable": true,
                      "calcs": [
                        "lastNotNull"
                      ],
                      "displayMode": "table",
                      "placement": "right",
                      "showLegend": true
                    },
                    "tooltip": {
                      "mode": "single"
                    }
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "ops",
                      "custom": {
                        "fillOpacity": 10,
                        "showPoints": "never",
                        "spanNulls": true
                      }
                    },
                    "overrides": []
