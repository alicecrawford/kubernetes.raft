apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-victorialogs-explorer-node
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
  annotations: {}
data:
  grafana-dashboard-victorialogs-explorer.json: |-
    {
      "apiVersion": "dashboard.grafana.app/v2",
      "kind": "Dashboard",
      "metadata": {
        "name": "victorialogs-node-view",
        "namespace": "default"
      },
      "spec": {
        "annotations": [
          {
            "kind": "AnnotationQuery",
            "spec": {
              "query": {
                "kind": "DataQuery",
                "group": "grafana",
                "version": "v0",
                "datasource": {
                  "name": "-- Grafana --"
                },
                "spec": {}
              },
              "enable": true,
              "hide": true,
              "iconColor": "rgba(0, 211, 255, 1)",
              "name": "Annotations & Alerts",
              "builtIn": true,
              "legacyOptions": {
                "type": "dashboard"
              }
            }
          }
        ],
        "cursorSync": "Off",
        "description": "Dashboard to explore Victoria Logs",
        "editable": true,
        "elements": {
          "panel-1": {
            "kind": "Panel",
            "spec": {
              "id": 1,
              "title": "Logs in for ${hostname}",
              "description": "",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "victoriametrics-logs-datasource",
                          "version": "v0",
                          "datasource": {
                            "name": "VictoriaLogs"
                          },
                          "spec": {
                            "editorMode": "code",
                            "expr": "_stream: {_HOSTNAME=~\"$hostname\"} $query | sort desc | offset $offset | limit $limit",
                            "queryType": "range"
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "logs",
                "version": "11.5.1",
                "spec": {
                  "options": {
                    "dedupStrategy": "none",
                    "enableInfiniteScrolling": false,
                    "enableLogDetails": true,
                    "prettifyLogMessage": true,
                    "showCommonLabels": false,
                    "showLabels": false,
                    "showTime": true,
                    "sortOrder": "Descending",
                    "wrapLogMessage": true
                  },
                  "fieldConfig": {
                    "defaults": {},
                    "overrides": []
                  }
                }
              }
            }
          },
          "panel-2": {
            "kind": "Panel",
            "spec": {
              "id": 2,
              "title": "Logs for ${hostname}",
              "description": "",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "victoriametrics-logs-datasource",
                          "version": "v0",
                          "datasource": {
                            "name": "VictoriaLogs"
                          },
                          "spec": {
                            "editorMode": "code",
                            "expr": "_stream: {_HOSTNAME=~\"$hostname\"} $query | stats count()",
                            "legendFormat": "${hostname}",
                            "queryType": "statsRange"
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "11.5.1",
                "spec": {
                  "options": {
                    "legend": {
                      "calcs": [
                        "sum"
                      ],
                      "displayMode": "list",
                      "placement": "bottom",
                      "showLegend": true
                    },
                    "tooltip": {
                      "hideZeros": false,
                      "mode": "single",
                      "sort": "none"
                    }
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "short",
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "value": null,
                            "color": "green"
                          },
                          {
                            "value": 80,
                            "color": "red"
                          }
                        ]
                      },
                      "color": {
                        "mode": "palette-classic"
                      },
                      "custom": {
                        "axisBorderShow": false,
                        "axisCenteredZero": false,
                        "axisColorMode": "text",
                        "axisLabel": "",
                        "axisPlacement": "auto",
                        "barAlignment": 0,
                        "barWidthFactor": 0.6,
                        "drawStyle": "bars",
                        "fillOpacity": 0,
                        "gradientMode": "none",
                        "hideFrom": {
                          "legend": false,
                          "tooltip": false,
                          "viz": false
                        },
                        "insertNulls": false,
                        "lineInterpolation": "linear",
                        "lineWidth": 2,
                        "pointSize": 5,
                        "scaleDistribution": {
                          "type": "linear"
                        },
                        "showPoints": "auto",
                        "spanNulls": false,
                        "stacking": {
                          "group": "A",
                          "mode": "none"
                        },
                        "thresholdsStyle": {
                          "mode": "off"
                        }
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
          "panel-3": {
            "kind": "Panel",
            "spec": {
              "id": 3,
              "title": "Count by $count_by",
              "description": "",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "victoriametrics-logs-datasource",
                          "version": "v0",
                          "datasource": {
                            "name": "VictoriaLogs"
                          },
                          "spec": {
                            "editorMode": "code",
                            "expr": "_stream: {_HOSTNAME=~\"$hostname\"} $query | stats by (\"$count_by\") count() c | sort by (c desc) | limit 50",
                            "legendFormat": "{{$count_by}}",
                            "queryType": "stats"
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "piechart",
                "version": "11.5.1",
                "spec": {
                  "options": {
                    "legend": {
                      "displayMode": "list",
                      "placement": "bottom",
                      "showLegend": true
                    },
                    "pieType": "pie",
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "tooltip": {
                      "hideZeros": false,
                      "mode": "single",
                      "sort": "none"
                    }
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "short",
                      "color": {
                        "mode": "palette-classic"
                      },
                      "custom": {
                        "hideFrom": {
                          "legend": false,
                          "tooltip": false,
                          "viz": false
                        }
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          }
        },
        "layout": {
          "kind": "GridLayout",
          "spec": {
            "items": [
              {
                "kind": "GridLayoutItem",
                "spec": {
                  "x": 0,
                  "y": 0,
                  "width": 18,
                  "height": 6,
                  "element": {
                    "kind": "ElementReference",
                    "name": "panel-2"
                  }
                }
              },
              {
                "kind": "GridLayoutItem",
                "spec": {
                  "x": 18,
                  "y": 0,
                  "width": 6,
                  "height": 6,
                  "element": {
                    "kind": "ElementReference",
                    "name": "panel-3"
                  }
                }
              },
              {
                "kind": "GridLayoutItem",
                "spec": {
                  "x": 0,
                  "y": 6,
                  "width": 24,
                  "height": 23,
                  "element": {
                    "kind": "ElementReference",
                    "name": "panel-1"
                  }
                }
              }
            ]
          }
        },
        "links": [
           {
            "title": "View In Explore",
            "type": "link",
            "icon": "bolt",
            "tooltip": "",
            "url": "/explore?orgId=1&left={\"datasource\":\"$DS_VICTORIALOGS\",\"queries\":[{\"expr\":\"_stream: {_HOSTNAME=~\\\"$hostname\\\"} $query\"}]}",
            "tags": [],
            "asDropdown": false,
            "targetBlank": true,
            "includeVars": true,
            "keepTime": true
          },
         {
            "title": "Set time at now",
            "type": "link",
            "icon": "clock",
            "tooltip": "Set time to the current window",
            "url": "/d/${__dashboard.uid}?from=${__from:date:x}&to=${__to:date:x}",
            "tags": [],
            "asDropdown": false,
            "targetBlank": false,
            "includeVars": true,
            "keepTime": false
          }
        ],
        "liveNow": false,
        "preload": false,
        "tags": [],
        "timeSettings": {
          "timezone": "browser",
          "from": "now-30m",
          "to": "now",
          "autoRefresh": "",
          "autoRefreshIntervals": [
            "5s",
            "10s",
            "30s",
            "1m",
            "5m",
            "15m",
            "30m",
            "1h",
            "2h",
            "1d"
          ],
          "hideTimepicker": false,
          "fiscalYearStartMonth": 0
        },
        "title": "VictoriaLogs Node View",
        "variables": [
          {
            "kind": "DatasourceVariable",
            "spec": {
              "name": "DS_VICTORIALOGS",
              "pluginId": "victoriametrics-logs-datasource",
              "refresh": "onDashboardLoad",
              "regex": "",
              "current": {
                "text": "",
                "value": ""
              },
              "options": [],
              "multi": false,
              "includeAll": false,
              "label": "Logs Datasource",
              "hide": "dontHide",
              "skipUrlSync": false,
              "description": "Datasource for logs",
              "allowCustomValue": true
            }
          },
          {
            "kind": "QueryVariable",
            "spec": {
              "name": "hostname",
              "current": {
                "text": "",
                "value": ""
              },
              "hide": "dontHide",
              "refresh": "onTimeRangeChanged",
              "skipUrlSync": false,
              "query": {
                "kind": "DataQuery",
                "group": "victoriametrics-logs-datasource",
                "version": "v0",
                "datasource": {
                  "name": "VictoriaLogs"
                },
                "spec": {
                  "field": "_HOSTNAME",
                  "limit": 100,
                  "query": "",
                  "refId": "VictoriaLogsVariableQueryEditor-VariableQuery",
                  "type": "fieldValue"
                }
              },
              "regex": "",
              "sort": "alphabeticalAsc",
              "definition": "",
              "options": [],
              "multi": false,
              "includeAll": true,
              "allValue": "..*",
              "allowCustomValue": true
            }
          },
          {
            "kind": "QueryVariable",
            "spec": {
              "name": "count_by",
              "current": {
                "text": "",
                "value": ""
              },
              "hide": "dontHide",
              "refresh": "onTimeRangeChanged",
              "skipUrlSync": false,
              "query": {
                "kind": "DataQuery",
                "group": "victoriametrics-logs-datasource",
                "version": "v0",
                "datasource": {
                  "name": "VictoriaLogs"
                },
                "spec": {
                  "field": "kubernetes.container_name",
                  "limit": 25,
                  "query": "{_HOSTNAME=~\"$hostname\"}",
                  "refId": "VictoriaLogsVariableQueryEditor-VariableQuery",
                  "type": "fieldName"
                }
              },
              "regex": "/^[a-zA-Z].+/",
              "sort": "alphabeticalAsc",
              "definition": "{_HOSTNAME=~\"$hostname\"}",
              "options": [],
              "multi": false,
              "includeAll": false,
              "allowCustomValue": true
            }
          },
          {
            "kind": "CustomVariable",
            "spec": {
              "name": "limit",
              "query": "50,100,250,500,1000",
              "current": {
                "text": "50",
                "value": "50"
              },
              "options": [
                {
                  "selected": true,
                  "text": "50",
                  "value": "50"
                },
                {
                  "selected": false,
                  "text": "100",
                  "value": "100"
                },
                {
                  "selected": false,
                  "text": "250",
                  "value": "250"
                },
                {
                  "selected": false,
                  "text": "500",
                  "value": "500"
                },
                {
                  "selected": false,
                  "text": "1000",
                  "value": "1000"
                }
              ],
              "multi": false,
              "includeAll": false,
              "hide": "dontHide",
              "skipUrlSync": false,
              "allowCustomValue": true
            }
          },
          {
            "kind": "TextVariable",
            "spec": {
              "current": {
                "text": "0",
                "value": "0"
              },
              "hide": "dontHide",
              "name": "offset",
              "query": "0",
              "skipUrlSync": false
            }
          },
          {
            "kind": "TextVariable",
            "spec": {
              "name": "query",
              "current": {
                "text": "",
                "value": ""
              },
              "query": "",
              "hide": "dontHide",
              "skipUrlSync": false
            }
          }
        ]
      }
    }
