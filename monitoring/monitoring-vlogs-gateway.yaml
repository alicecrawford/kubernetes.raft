apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: monitoring-vlogs
  namespace: monitoring
spec:
  gatewayClassName: istio
  listeners:
    - allowedRoutes:
        namespaces:
          from: Same
      name: https
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - group: ""
            kind: Secret
            name: monitoring-vlogs-certificate
        mode: Terminate
