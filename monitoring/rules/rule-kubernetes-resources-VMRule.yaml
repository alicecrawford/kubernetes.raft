apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: rule-kubernetes-resources
  namespace: monitoring
spec:
  groups:
  - name: kubernetes-resources
    rules:
    - alert: KubeCPUOvercommit
      annotations:
        description: Cluster {{ $labels.polycule }} has overcommitted CPU resource
          requests for Pods by {{ printf "%.2f" $value }} CPU shares and cannot tolerate
          node failure.
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubecpuovercommit
        summary: Cluster has overcommitted CPU resource requests.
      expr: (((sum(namespace_cpu:kube_pod_container_resource_requests:sum) by(polycule)
        - sum(kube_node_status_allocatable{job="kube-state-metrics",resource="cpu"})
        by(polycule)) > 0) and (count(max(kube_node_role{job="kube-state-metrics",role="control-plane"})
        by(polycule,node)) by(polycule) < 3)) or ((sum(namespace_cpu:kube_pod_container_resource_requests:sum)
        by(polycule) - ((sum(kube_node_status_allocatable{job="kube-state-metrics",resource="cpu"})
        by(polycule) - max(kube_node_status_allocatable{job="kube-state-metrics",resource="cpu"})
        by(polycule)) > 0)) > 0)
      for: 10m
      labels:
        severity: warning
    - alert: KubeMemoryOvercommit
      annotations:
        description: Cluster {{ $labels.polycule }} has overcommitted memory resource
          requests for Pods by {{ $value | humanize }} bytes and cannot tolerate node
          failure.
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubememoryovercommit
        summary: Cluster has overcommitted memory resource requests.
      expr: (((sum(namespace_memory:kube_pod_container_resource_requests:sum) by(polycule)
        - sum(kube_node_status_allocatable{job="kube-state-metrics",resource="memory"})
        by(polycule)) > 0) and (count(max(kube_node_role{job="kube-state-metrics",role="control-plane"})
        by(polycule,node)) by(polycule) < 3)) or ((sum(namespace_memory:kube_pod_container_resource_requests:sum)
        by(polycule) - ((sum(kube_node_status_allocatable{job="kube-state-metrics",resource="memory"})
        by(polycule) - max(kube_node_status_allocatable{job="kube-state-metrics",resource="memory"})
        by(polycule)) > 0)) > 0)
      for: 10m
      labels:
        severity: warning
    - alert: KubeCPUQuotaOvercommit
      annotations:
        description: Cluster {{ $labels.polycule }} has overcommitted CPU resource
          requests for Namespaces.
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubecpuquotaovercommit
        summary: Cluster has overcommitted CPU resource requests.
      expr: (sum(min(kube_resourcequota{job="kube-state-metrics",type="hard",resource=~"(cpu|requests.cpu)"})
        without(resource)) by(polycule) / sum(kube_node_status_allocatable{resource="cpu",job="kube-state-metrics"})
        by(polycule)) > 1.5
      for: 5m
      labels:
        severity: warning
    - alert: KubeMemoryQuotaOvercommit
      annotations:
        description: Cluster {{ $labels.polycule }} has overcommitted memory resource
          requests for Namespaces.
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubememoryquotaovercommit
        summary: Cluster has overcommitted memory resource requests.
      expr: (sum(min(kube_resourcequota{job="kube-state-metrics",type="hard",resource=~"(memory|requests.memory)"})
        without(resource)) by(polycule) / sum(kube_node_status_allocatable{resource="memory",job="kube-state-metrics"})
        by(polycule)) > 1.5
      for: 5m
      labels:
        severity: warning
    - alert: KubeQuotaAlmostFull
      annotations:
        description: Namespace {{ $labels.namespace }} is using {{ $value | humanizePercentage
          }} of its {{ $labels.resource }} quota on cluster {{ $labels.polycule }}.
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubequotaalmostfull
        summary: Namespace quota is going to be full.
      expr: ((topk(1, max(kube_resourcequota{job="kube-state-metrics",type="used"})
        without(instance,job,type)) by(polycule,namespace,resource,resourcequota)
        / on(polycule,namespace,resource,resourcequota) group_left() topk(1, max(kube_resourcequota{job="kube-state-metrics",type="hard"})
        without(instance,job,type) > 0) by(polycule,namespace,resource,resourcequota))
        > 0.9) < 1
      for: 15m
      labels:
        severity: info
    - alert: KubeQuotaFullyUsed
      annotations:
        description: Namespace {{ $labels.namespace }} is using {{ $value | humanizePercentage
          }} of its {{ $labels.resource }} quota on cluster {{ $labels.polycule }}.
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubequotafullyused
        summary: Namespace quota is fully used.
      expr: (topk(1, max(kube_resourcequota{job="kube-state-metrics",type="used"})
        without(instance,job,type)) by(polycule,namespace,resource,resourcequota)
        / on(polycule,namespace,resource,resourcequota) group_left() topk(1, max(kube_resourcequota{job="kube-state-metrics",type="hard"})
        without(instance,job,type) > 0) by(polycule,namespace,resource,resourcequota))
        == 1
      for: 15m
      labels:
        severity: info
    - alert: KubeQuotaExceeded
      annotations:
        description: Namespace {{ $labels.namespace }} is using {{ $value | humanizePercentage
          }} of its {{ $labels.resource }} quota on cluster {{ $labels.polycule }}.
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubequotaexceeded
        summary: Namespace quota has exceeded the limits.
      expr: (topk(1, max(kube_resourcequota{job="kube-state-metrics",type="used"})
        without(instance,job,type)) by(polycule,namespace,resource,resourcequota)
        / on(polycule,namespace,resource,resourcequota) group_left() topk(1, max(kube_resourcequota{job="kube-state-metrics",type="hard"})
        without(instance,job,type) > 0) by(polycule,namespace,resource,resourcequota))
        > 1
      for: 15m
      labels:
        severity: warning
    - alert: CPUThrottlingHigh
      annotations:
        description: '{{ $value | humanizePercentage }} throttling of CPU in namespace
          {{ $labels.namespace }} for container {{ $labels.container }} in pod {{
          $labels.pod }} on cluster {{ $labels.polycule }}.'
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/cputhrottlinghigh
        summary: Processes experience elevated CPU throttling.
      expr: (sum(topk(1, increase(container_cpu_cfs_throttled_periods_total{container!="",job="kubelet",metrics_path="/metrics/cadvisor"}[5m]))
        by(polycule,namespace,pod,container,instance)) without(id,metrics_path,name,image,endpoint,job,node)
        / on(polycule,namespace,pod,container,instance) group_left() sum(topk(1, increase(container_cpu_cfs_periods_total{job="kubelet",metrics_path="/metrics/cadvisor"}[5m]))
        by(polycule,namespace,pod,container,instance)) without(id,metrics_path,name,image,endpoint,job,node))
        > 0.25
      for: 15m
      labels:
        severity: info
