apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: rule-vl-health
  namespace: monitoring
spec:
  groups:
  - name: vl-health
    rules:
    - alert: TooManyRestarts
      annotations:
        description: 'Job {{ $labels.job }} (instance {{ $labels.instance }}) has
          restarted more than twice in the last 15 minutes. It might be crashlooping.

          '
        summary: '{{ $labels.job }} too many restarts (instance {{ $labels.instance
          }})'
      expr: changes(process_start_time_seconds{job=~".*(victorialogs|vlstorage|vlselect|vlinsert|vlagent).*"}[15m])
        > 2
      labels:
        severity: critical
      record: ''
    - alert: ServiceDown
      annotations:
        description: '{{ $labels.instance }} of job {{ $labels.job }} has been down
          for more than 2 minutes.'
        summary: Service {{ $labels.job }} is down on {{ $labels.instance }}
      expr: up{job=~".*(victorialogs|vlstorage|vlselect|vlinsert|vlagent).*"} == 0
      for: 2m
      labels:
        severity: critical
      record: ''
    - alert: ProcessNearFDLimits
      annotations:
        description: 'Exhausting OS file descriptors limit can cause severe degradation
          of the process.

          Consider to increase the limit as fast as possible.

          '
        summary: Number of free file descriptors is less than 100 for "{{ $labels.job
          }}"("{{ $labels.instance }}") for the last 5m
      expr: (process_max_fds{job=~".*(victorialogs|vlstorage|vlselect|vlinsert|vlagent).*"}
        - process_open_fds{job=~".*(victorialogs|vlstorage|vlselect|vlinsert|vlagent).*"})
        < 100
      for: 5m
      labels:
        severity: critical
      record: ''
    - alert: TooHighMemoryUsage
      annotations:
        description: 'Too high memory usage may result into multiple issues such as
          OOMs or degraded performance.

          Consider to either increase available memory or decrease the load on the
          process.

          '
        summary: It is more than 80% of memory used by "{{ $labels.job }}"("{{ $labels.instance
          }}")
      expr: (min_over_time(process_resident_memory_anon_bytes{job=~".*(victorialogs|vlstorage|vlselect|vlinsert|vlagent).*"}[10m])
        / vm_available_memory_bytes{job=~".*(victorialogs|vlstorage|vlselect|vlinsert|vlagent).*"})
        > 0.8
      for: 5m
      labels:
        severity: critical
      record: ''
    - alert: TooHighCPUUsage
      annotations:
        description: 'Too high CPU usage may be a sign of insufficient resources and
          make process unstable. Consider to either increase available CPU resources
          or decrease the load on the process.

          '
        summary: More than 90% of CPU is used by "{{ $labels.job }}"("{{ $labels.instance
          }}") during the last 5m
      expr: (rate(process_cpu_seconds_total{job=~".*(victorialogs|vlstorage|vlselect|vlinsert|vlagent).*"}[5m])
        / process_cpu_cores_available{job=~".*(victorialogs|vlstorage|vlselect|vlinsert|vlagent).*"})
        > 0.9
      for: 5m
      labels:
        severity: critical
      record: ''
    - alert: TooHighGoroutineSchedulingLatency
      annotations:
        description: 'Go runtime is unable to schedule goroutines execution in acceptable
          time. This is usually a sign of insufficient CPU resources or CPU throttling.
          Verify that service has enough CPU resources. Otherwise, the service could
          work unreliably with delays in processing.

          '
        summary: '"{{ $labels.job }}"("{{ $labels.instance }}") has insufficient CPU
          resources for >15m'
      expr: histogram_quantile(0.99, sum(rate(go_sched_latencies_seconds_bucket{job=~".*(victorialogs|vlstorage|vlselect|vlinsert|vlagent).*"}[5m]))
        by(le,job,instance)) > 0.1
      for: 15m
      labels:
        severity: critical
      record: ''
    - alert: TooManyLogs
      annotations:
        description: 'Logging rate for job \"{{ $labels.job }}\" ({{ $labels.instance
          }}) is {{ $value }} for last 15m. Worth to check logs for specific error
          messages.

          '
        summary: Too many logs printed for job "{{ $labels.job }}" ({{ $labels.instance
          }})
      expr: sum(increase(vm_log_messages_total{job=~".*(victorialogs|vlstorage|vlselect|vlinsert|vlagent).*",level="error"}[5m]))
        without(app_version,location) > 0
      for: 15m
      labels:
        severity: warning
      record: ''
    - alert: RequestErrorsToAPI
      annotations:
        description: Requests to path {{ $labels.path }} are receiving errors. Please
          verify if clients are sending correct requests.
        summary: Too many errors served for path {{ $labels.path }} (instance {{ $labels.instance
          }})
      expr: increase(vl_http_errors_total[5m]) > 0
      for: 15m
      labels:
        severity: warning
      record: ''
    - alert: RowsRejectedOnIngestion
      annotations:
        description: 'VictoriaLogs is rejecting to ingest rows on "{{ $labels.instance
          }}" due to the following reason: "{{ $labels.reason }}"'
        summary: Some rows are rejected on "{{ $labels.instance }}" on ingestion attempt
      expr: rate(vl_rows_dropped_total[5m]) > 0
      for: 15m
      labels:
        severity: warning
      record: ''
    - alert: ConcurrentInsertsHitTheLimit
      annotations:
        description: 'The limit of concurrent inserts on instance {{ $labels.instance
          }} depends on the number of CPUs.

          Usually, when component constantly hits the limit it is likely the component
          is overloaded and requires more CPU.

          In some cases the alert might trigger if there are too many clients making
          write attempts to the component.

          If the component''s CPU usage and network saturation are at normal level,
          then

          it might be worth adjusting `-maxConcurrentInserts` cmd-line flag.

          '
        summary: '{{ $labels.job }} on instance {{ $labels.instance }} is constantly
          hitting concurrent inserts limit'
      expr: avg_over_time(vm_concurrent_insert_current{job=~".*(victorialogs|vlstorage|vlinsert|vlagent).*"}[1m])
        >= vm_concurrent_insert_capacity{job=~".*(victorialogs|vlstorage|vlinsert|vlagent).*"}
      for: 15m
      labels:
        severity: warning
      record: ''
