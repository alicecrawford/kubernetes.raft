apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: rule-k8s-rules-container-memory-cache
  namespace: monitoring
spec:
  groups:
  - name: k8s.rules.container_memory_cache
    rules:
    - alert: ''
      expr: container_memory_cache{job="kubelet",metrics_path="/metrics/cadvisor",image!=""}
        * on(polycule,namespace,pod) group_left(node) topk(1, max(kube_pod_info{node!=""})
        by(polycule,namespace,pod,node)) by(polycule,namespace,pod)
      record: node_namespace_pod_container:container_memory_cache
