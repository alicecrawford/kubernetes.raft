apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: rule-vlogs
  namespace: monitoring
spec:
  groups:
    - name: vlogs
      rules:
        - alert: DiskRunsOutOfSpace
          annotations:
            description: "Disk utilisation on instance {{ $labels.instance }} is more than
              80%.

              \ Having less than 20% of free disk space could cripple merge
              processes and overall performance. Consider to limit the ingestion
              rate, decrease retention or scale the disk space if possible."
            summary: Instance {{ $labels.instance }} (job={{ $labels.job }}) will run out of
              disk space soon
          expr: (sum(vl_data_size_bytes) by(job,instance) / (sum(vl_free_disk_space_bytes)
            by(job,instance) + sum(vl_data_size_bytes) by(job,instance))) > 0.8
          for: 30m
          labels:
            severity: critical
          record: ''
        - alert: ConcurrentQueriesHitTheLimit
          annotations:
            description: 'The limit of concurrent queries on instance {{ $labels.instance }}
              is controlled by `-search.maxConcurrentRequests`.

              Usually, when the component constantly hits the limit it is likely
              overloaded and requires more CPU or more replicas.

              In some cases the alert might trigger if clients send too many
              expensive queries to the component.

              If the component''s CPU usage and storage latency are at normal
              level, then

              it might be worth adjusting `-search.maxConcurrentRequests`.

              '
            summary: '{{ $labels.job }} on instance {{ $labels.instance }} is constantly
              hitting concurrent query limit'
          expr: avg_over_time(vl_concurrent_select_current[1m]) >=
            vl_concurrent_select_capacity
          for: 15m
          labels:
            severity: warning
          record: ''
        - alert: TooHighQueryLoad
          annotations:
            description: 'Instance {{ $labels.instance }} ({{ $labels.job }}) is failing to
              serve read queries during last 15m.

              Concurrency limit `-search.maxConcurrentRequests` was reached on
              this instance and extra queries were

              put into the queue for `-search.maxQueueDuration` interval. But
              even after waiting in the queue these queries weren''t served.

              This happens if instance is overloaded with the current workload,
              or datasource is too slow to respond.

              Possible solutions are the following:

              * reduce the query load;

              * increase compute resources or number of replicas;

              * adjust limits `-search.maxConcurrentRequests` and
              `-search.maxQueueDuration`.

              See more at
              https://docs.victoriametrics.com/victorialogs/logsql/#troubleshooting.

              '
            summary: Read queries fail with timeout for {{ $labels.job }} on instance {{
              $labels.instance }}
          expr: increase(vl_concurrent_select_limit_timeout_total[5m]) > 0
          for: 15m
          labels:
            severity: warning
          record: ''
