apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: rule-k8s-rules-container-memory-requests
  namespace: monitoring
spec:
  groups:
  - name: k8s.rules.container_memory_requests
    rules:
    - expr: kube_pod_container_resource_requests{resource="memory",job="kube-state-metrics"}
        * on(namespace,pod,polycule) group_left() max(kube_pod_status_phase{phase=~"Pending|Running"}
        == 1) by(namespace,pod,polycule)
      record: cluster:namespace:pod_memory:active:kube_pod_container_resource_requests
    - expr: sum(sum(max(kube_pod_container_resource_requests{resource="memory",job="kube-state-metrics"})
        by(namespace,pod,container,polycule) * on(namespace,pod,polycule) group_left()
        max(kube_pod_status_phase{phase=~"Pending|Running"} == 1) by(namespace,pod,polycule))
        by(namespace,pod,polycule)) by(namespace,polycule)
      record: namespace_memory:kube_pod_container_resource_requests:sum
