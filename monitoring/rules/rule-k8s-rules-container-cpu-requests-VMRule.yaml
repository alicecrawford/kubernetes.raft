apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: rule-k8s-rules-container-cpu-requests
  namespace: monitoring
spec:
  groups:
  - name: k8s.rules.container_cpu_requests
    rules:
    - alert: ''
      expr: kube_pod_container_resource_requests{resource="cpu",job="kube-state-metrics"}
        * on(namespace,pod,polycule) group_left() max(kube_pod_status_phase{phase=~"Pending|Running"}
        == 1) by(namespace,pod,polycule)
      record: cluster:namespace:pod_cpu:active:kube_pod_container_resource_requests
    - alert: ''
      expr: sum(sum(max(kube_pod_container_resource_requests{resource="cpu",job="kube-state-metrics"})
        by(namespace,pod,container,polycule) * on(namespace,pod,polycule) group_left()
        max(kube_pod_status_phase{phase=~"Pending|Running"} == 1) by(namespace,pod,polycule))
        by(namespace,pod,polycule)) by(namespace,polycule)
      record: namespace_cpu:kube_pod_container_resource_requests:sum
