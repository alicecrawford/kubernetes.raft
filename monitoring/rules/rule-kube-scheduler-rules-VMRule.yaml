apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: rule-kube-scheduler-rules
  namespace: monitoring
spec:
  groups:
    - name: kube-scheduler.rules
      rules:
        - alert: ''
          expr: histogram_quantile(0.99,
            sum(rate(scheduler_scheduling_attempt_duration_seconds_bucket{job="kube-scheduler"}[5m]))
            without(instance,pod))
          labels:
            quantile: '0.99'
          record: cluster_quantile:scheduler_scheduling_attempt_duration_seconds:histogram_quantile
        - alert: ''
          expr: histogram_quantile(0.99,
            sum(rate(scheduler_scheduling_algorithm_duration_seconds_bucket{job="kube-scheduler"}[5m]))
            without(instance,pod))
          labels:
            quantile: '0.99'
          record: cluster_quantile:scheduler_scheduling_algorithm_duration_seconds:histogram_quantile
        - alert: ''
          expr: histogram_quantile(0.99,
            sum(rate(scheduler_pod_scheduling_sli_duration_seconds_bucket{job="kube-scheduler"}[5m]))
            without(instance,pod))
          labels:
            quantile: '0.99'
          record: cluster_quantile:scheduler_pod_scheduling_sli_duration_seconds:histogram_quantile
        - alert: ''
          expr: histogram_quantile(0.9,
            sum(rate(scheduler_scheduling_attempt_duration_seconds_bucket{job="kube-scheduler"}[5m]))
            without(instance,pod))
          labels:
            quantile: '0.9'
          record: cluster_quantile:scheduler_scheduling_attempt_duration_seconds:histogram_quantile
        - alert: ''
          expr: histogram_quantile(0.9,
            sum(rate(scheduler_scheduling_algorithm_duration_seconds_bucket{job="kube-scheduler"}[5m]))
            without(instance,pod))
          labels:
            quantile: '0.9'
          record: cluster_quantile:scheduler_scheduling_algorithm_duration_seconds:histogram_quantile
        - alert: ''
          expr: histogram_quantile(0.9,
            sum(rate(scheduler_pod_scheduling_sli_duration_seconds_bucket{job="kube-scheduler"}[5m]))
            without(instance,pod))
          labels:
            quantile: '0.9'
          record: cluster_quantile:scheduler_pod_scheduling_sli_duration_seconds:histogram_quantile
        - alert: ''
          expr: histogram_quantile(0.5,
            sum(rate(scheduler_scheduling_attempt_duration_seconds_bucket{job="kube-scheduler"}[5m]))
            without(instance,pod))
          labels:
            quantile: '0.5'
          record: cluster_quantile:scheduler_scheduling_attempt_duration_seconds:histogram_quantile
        - alert: ''
          expr: histogram_quantile(0.5,
            sum(rate(scheduler_scheduling_algorithm_duration_seconds_bucket{job="kube-scheduler"}[5m]))
            without(instance,pod))
          labels:
            quantile: '0.5'
          record: cluster_quantile:scheduler_scheduling_algorithm_duration_seconds:histogram_quantile
        - alert: ''
          expr: histogram_quantile(0.5,
            sum(rate(scheduler_pod_scheduling_sli_duration_seconds_bucket{job="kube-scheduler"}[5m]))
            without(instance,pod))
          labels:
            quantile: '0.5'
          record: cluster_quantile:scheduler_pod_scheduling_sli_duration_seconds:histogram_quantile
