apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: rule-vlagent
  namespace: monitoring
spec:
  groups:
  - name: vlagent
    rules:
    - alert: PersistentQueueIsDroppingData
      annotations:
        description: vlagent dropped {{ $value | humanize1024 }} from persistent queue
          on instance {{ $labels.instance }} for the last 10m.
        summary: Instance {{ $labels.instance }} is dropping data from persistent
          queue
      expr: sum(increase(vm_persistentqueue_bytes_dropped_total[5m])) without(path)
        > 0
      for: 10m
      labels:
        severity: critical
    - alert: RejectedRemoteWriteDataBlocksAreDropped
      annotations:
        description: Job "{{ $labels.job }}" on instance {{ $labels.instance }} drops
          the rejected by remote-write server data blocks. Check the logs to find
          the reason for rejects.
        summary: vlagent is dropping data blocks that are rejected by remote storage
      expr: sum(increase(vlagent_remotewrite_packets_dropped_total[5m])) without(url)
        > 0
      for: 15m
      labels:
        severity: warning
    - alert: TooManyRemoteWriteErrors
      annotations:
        description: "vlagent fails to push data via remote write protocol to destination\
          \ \"{{ $labels.url }}\"\n Ensure that destination is up and reachable."
        summary: Job "{{ $labels.job }}" on instance {{ $labels.instance }} fails
          to push to remote storage
      expr: rate(vlagent_remotewrite_retries_count_total[5m]) > 0
      for: 15m
      labels:
        severity: warning
    - alert: RemoteWriteConnectionIsSaturated
      annotations:
        description: "The remote write connection between vlagent \"{{ $labels.job\
          \ }}\" (instance {{ $labels.instance }}) and destination \"{{ $labels.url\
          \ }}\" is saturated by more than 90% and vlagent won't be able to keep up.\n\
          \ There could be the following reasons for this:\n * vlagent can't send\
          \ data fast enough through the existing network connections. Increase `-remoteWrite.queues`\
          \ cmd-line flag value to establish more connections per destination.\n *\
          \ remote destination can't accept data fast enough. Check if remote destination\
          \ has enough resources for processing."
        summary: Remote write connection from "{{ $labels.job }}" (instance {{ $labels.instance
          }}) to {{ $labels.url }} is saturated
      expr: (rate(vlagent_remotewrite_send_duration_seconds_total[5m]) / vlagent_remotewrite_queues)
        > 0.9
      for: 15m
      labels:
        severity: warning
    - alert: PersistentQueueForWritesIsSaturated
      annotations:
        description: Persistent queue writes for vlagent "{{ $labels.job }}" (instance
          {{ $labels.instance }}) are saturated by more than 90% and vlagent won't
          be able to keep up with flushing data on disk. In this case, consider to
          decrease load on the vlagent or improve the disk throughput.
        summary: Persistent queue writes for instance {{ $labels.instance }} are saturated
      expr: rate(vm_persistentqueue_write_duration_seconds_total[5m]) > 0.9
      for: 15m
      labels:
        severity: warning
    - alert: PersistentQueueForReadsIsSaturated
      annotations:
        description: Persistent queue reads for vlagent "{{ $labels.job }}" (instance
          {{ $labels.instance }}) are saturated by more than 90% and vlagent won't
          be able to keep up with reading data from the disk. In this case, consider
          to decrease load on the vlagent or improve the disk throughput.
        summary: Persistent queue reads for instance {{ $labels.instance }} are saturated
      expr: rate(vm_persistentqueue_read_duration_seconds_total[5m]) > 0.9
      for: 15m
      labels:
        severity: warning
    - alert: PersistentQueueRunsOutOfSpaceIn12Hours
      annotations:
        description: RemoteWrite destination ({{ $labels.url }}) is unavailable or
          unable to receive data in a timely manner, so the persistent queue size
          is growing. Once the available space is exhausted, some samples will be
          discarded and cause incident. Please check the health of remoteWrite destination
          ({{ $labels.url }}).
        summary: Persistent Queue (url {{ $labels.url }}) of {{ $labels.instance }}
          (job:{{ $labels.job }}) will run out of space in 12 hours.
      expr: (((sum(vm_persistentqueue_free_disk_space_bytes) by(job,instance,path)
        / (sum(deriv(vm_persistentqueue_bytes_pending[1m])) by(job,instance,path)
        > 0)) * on(job,instance,path) group_left(url) ((vlagent_remotewrite_pending_data_bytes
        * 0) + 1)) < 43200) > 0
      for: 10m
      labels:
        severity: warning
    - alert: PersistentQueueRunsOutOfSpaceIn4Hours
      annotations:
        description: RemoteWrite destination ({{ $labels.url }}) is unavailable or
          unable to receive data in a timely manner, so the persistent queue size
          is growing. Once the available space is exhausted, some samples will be
          discarded and cause incident. Please check the health of remoteWrite destination
          ({{ $labels.url }}).
        summary: Persistent Queue (url {{ $labels.url }}) of {{ $labels.instance }}
          (job:{{ $labels.job }}) will run out of space in 4 hours.
      expr: (((sum(vm_persistentqueue_free_disk_space_bytes) by(job,instance,path)
        / (sum(deriv(vm_persistentqueue_bytes_pending[1m])) by(job,instance,path)
        > 0)) * on(job,instance,path) group_left(url) ((vlagent_remotewrite_pending_data_bytes
        * 0) + 1)) < 14400) > 0
      for: 10m
      labels:
        severity: critical
