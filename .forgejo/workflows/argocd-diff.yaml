---
name: ArgoCD Diff and Dry Run
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - '**'

jobs:
  argocd-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tools (ArgoCD CLI & yq)
        run: |
          mkdir -p $HOME/.local/bin

          # Download and install ArgoCD CLI locally
          curl -sSL -o $HOME/.local/bin/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x $HOME/.local/bin/argocd

          # Download and install yq locally
          wget -qO $HOME/.local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x $HOME/.local/bin/yq

          # Expose this directory to the PATH for all subsequent steps in this job
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run ArgoCD Diff
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          echo "Starting ArgoCD diff process..."

          set +e

          TEST_REPO=${FORGEJO_SERVER_URL}/${FORGEJO_REPOSITORY}
          REF_NAME=${FORGEJO_REF_NAME:-$FORGEJO_SHA}

          for app_file in argocd/applications/*.yaml; do
            [ -e "$app_file" ] || continue
            
            APP_NAME=$(yq e '.metadata.name' "$app_file")

            argocd app get $APP_NAME --refresh \
                --auth-token "$ARGOCD_TOKEN"

            HAS_SOURCES=$(yq eval '.spec.sources | select(. != null)' "$app_file")
            if [ -z "$HAS_SOURCES" ]; then
              # when i get time i should figure out what to do if i don't use sources
              continue
            fi

            SOURCES_COUNT=$(yq eval '.spec.sources | length' "$app_file")
            REV_FLAGS=""

            for ((i=0; i < SOURCES_COUNT; i++)); do
              POSITION=$((i + 1))

              REPO_URL=$(yq eval ".spec.sources[$i].repoURL" "$app_file")

              if [ "$REPO_URL" == "$TEST_REPO" ]; then
                REV_FLAGS="${REV_FLAGS} --source-positions ${POSITION} --revisions ${REF_NAME}"
              fi

            done

            echo "rev flags: ${REV_FLAGS}"

            echo "=================================================="
            echo "🔍 Diffing App: $APP_NAME"
            echo "📂 Source Path: $APP_PATH"
            echo "=================================================="

            # Note: We use || true because 'argocd app diff' returns exit code 1 
            # if there is a diff. We want to see the diff, not fail the pipeline.
            # We use --grpc-web to avoid HTTP/2 routing issues in CI environments.
            argocd app diff "$APP_NAME" \
              --local "$APP_PATH" \
              --server "$ARGOCD_SERVER" \
              --auth-token "$ARGOCD_TOKEN" \
              --server-side-generate

            EXIT_CODE=$?

            if [ $EXIT_CODE -eq 0 ]; then
              echo "✅ No differences found for $APP_NAME."
            elif [ $EXIT_CODE -eq 1 ]; then
              echo "⚠️ Differences found for $APP_NAME. (Pipeline continuing)"
            else
              echo "❌ FATAL: ArgoCD command failed with exit code $EXIT_CODE."
            fi
              
          done
