---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: istio-cni
  namespace: istio-system
  labels:
    app.kubernetes.io/name: istio-cni
    app.kubernetes.io/instance: istio
    app.kubernetes.io/part-of: istio
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: istio-cni
      app.kubernetes.io/instance: istio
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
