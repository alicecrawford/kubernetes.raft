---
global:
  domain: argocd.raft.lutris.house
  dualStack:
    ipFamilyPolicy: PreferDualStack

configs:
  params:
    server.insecure: true

  rbac:
    policy.csv: |
      g, cluster_admin, role:admin
      p, role:cluster-ci-role, applications, *, */*, allow
      p, role:cluster-ci-role, projects, *, *, allow
      p, role:cluster-ci-role, applicationsets, *, */*, allow
      p, role:cluster-ci-role, clusters, *, *, allow
      p, role:cluster-ci-role, repositories, *, *, allow
      g, cluster-ci, role:cluster-ci-role

  cm:
    accounts.cluster-ci: apiKey
    oidc.config: |
      name: Authelia
      issuer: https://auth.raft.lutris.house
      clientID: EyxwBAztTO~trz08ewnQTypUBnk-KllPKhaTf7NygQ_n2mcb6lwrVESaKz01nDYjw1Dz043X
      cliClientID: argo-cli
      clientSecret: $argocd-oidc-authelia:oidc.clientSecret
      requestedScopes: ['openid', 'offline_access', 'groups', 'email']
      requestedIDTokenClaims:
        argocd_claim: { essential: true }
        email: { essential: false }
        name: { essential: false }
        preferred_username: { essential: false }
        groups: { essential: true }
      enableUserInfoGroups: true
      userInfoPath: /api/oidc/userinfo
    exec.enabled: true
    statusbadge.enabled: true
    resource.customizations.ignoreDifferences.admissionregistration.k8s.io_ValidatingWebhookConfiguration: |
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
    resource.customizations.ignoreDifferences.admissionregistration.k8s.io_MutatingWebhookConfiguration: |
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
    ssh:
      extraHosts: |
        git.raft.lutris.house ssh-rsa 

controller:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

dex:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

redis:
  exporter:
    enabled: true
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

server:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

applicationSet:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

notifications:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

repoServer:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
