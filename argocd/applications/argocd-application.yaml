---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: system
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.2.2
      helm:
        valueFiles:
          - $values/argocd/values/values.yaml
    - repoURL: https://git.raft.lutris.house/the_raft/kubernetes.raft
      path: argocd
      targetRevision: HEAD
      ref: values
