---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: garage
  namespace: argocd
spec:
  project: system
  destination:
    server: https://kubernetes.default.svc
    namespace: garage
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
  ignoreDifferences:
    - kind: StatefulSet
      group: apps
      jqPathExpressions:
        - .spec.volumeClaimTemplates[].apiVersion
        - .spec.volumeClaimTemplates[].kind
    - kind: Secret
      jsonPointers:
        - /data/adminToken
        - /data/rpcSecret
    - kind: "*"
      group: apps
      jsonPointers:
        - /spec/template/metadata/annotations/checksum~1secret
  sources:
    - repoURL: https://git.raft.lutris.house/the_raft/kubernetes.raft
      path: garage
      targetRevision: HEAD
      ref: values
    - repoURL: https://datahub-local.github.io/garage-helm
      targetRevision: 0.7.1
      chart: garage
      helm:
        valueFiles:
          - $values/garage/values/values-garage.yaml
