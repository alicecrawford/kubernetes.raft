apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  labels:
    app.kubernetes.io/name: cilium-agent
    app.kubernetes.io/part-of: cilium
  name: cilium-agent
  namespace: kube-system
spec:
  attach_metadata: {}
  endpoints:
    - attach_metadata: {}
      honorLabels: true
      interval: 10s
      path: /metrics
      port: metrics
      relabelConfigs:
        - action: replace
          replacement: ${1}
          sourceLabels:
            - __meta_kubernetes_pod_node_name
          targetLabel: node
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      app.kubernetes.io/name: cilium-agent
  targetLabels:
    - k8s-app
