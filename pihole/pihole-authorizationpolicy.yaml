apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: pihole
  namespace: pihole
spec:
  action: CUSTOM
  provider:
    name: authelia
  rules:
    - to:
        - operation:
            hosts:
              - pihole.raft.lutris.house
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: pihole
