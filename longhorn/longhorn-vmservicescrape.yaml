apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  labels:
    name: longhorn
  name: longhorn
  namespace: monitoring
spec:
  attach_metadata: {}
  endpoints:
    - attach_metadata: {}
      port: manager
  namespaceSelector:
    matchNames:
      - longhorn-system
  selector:
    matchLabels:
      app: longhorn-manager
