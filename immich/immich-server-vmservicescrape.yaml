apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  labels:
    app.kubernetes.io/instance: immich
    app.kubernetes.io/name: server
    app.kubernetes.io/version: v2.6.3
  name: immich-server
  namespace: immich
spec:
  attach_metadata: {}
  endpoints:
    - attach_metadata: {}
      port: metrics-api
      scheme: http
    - attach_metadata: {}
      port: metrics-ms
      scheme: http
  jobLabel: immich-server
  namespaceSelector:
    matchNames:
      - immich
  selector:
    matchLabels:
      app.kubernetes.io/instance: immich
      app.kubernetes.io/name: server
      app.kubernetes.io/service: immich-server
